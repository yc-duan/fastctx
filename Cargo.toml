[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
repository = "https://github.com/yc-duan/fastctx"
authors = ["yc-duan"]

[workspace.dependencies]
anyhow = "1"
jiff = { version = "0.2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = "1"

[profile.release]
debug = "line-tables-only"
lto = "off"

# Keep the CLI's large async entry points buildable within a 1.2 GB build
# budget. Library crates retain the release profile's full optimization.
[profile.release.package.fastctx]
opt-level = 1
debug = false
codegen-units = 256
