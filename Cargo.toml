[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor/pdf_oxide", "vendor/yrs"]

[patch.crates-io]
pdf_oxide = { path = "vendor/pdf_oxide" }

[workspace.package]
version = "1.0.1-beta.13"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
repository = "https://github.com/yc-duan/fastctx"
authors = ["yc-duan"]

[workspace.dependencies]
anyhow = "1"
jiff = { version = "0.2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = "1"

# Every command hashes the World program it runs beside; unoptimized SHA-256
# makes that take seconds in a debug build.
[profile.dev.package.sha2]
opt-level = 3

[profile.release]
debug = "line-tables-only"
