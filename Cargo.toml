[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor/pdf_oxide", "vendor/yrs"]

# Held across an await, a lock holds up every task that waits for it; a
# crate's own lock guards are named in its `clippy.toml`.
[workspace.lints.clippy]
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
await_holding_invalid_type = "deny"

[patch.crates-io]
pdf_oxide = { path = "vendor/pdf_oxide" }

[workspace.package]
version = "1.0.1-beta.27"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
repository = "https://github.com/yc-duan/fastctx"
authors = ["yc-duan"]

[workspace.dependencies]
anyhow = "1"
jiff = { version = "0.2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = "1"

# Every command hashes the World program it runs beside; unoptimized SHA-256
# makes that take seconds in a debug build.
[profile.dev.package.sha2]
opt-level = 3

# Unoptimized SQLite is several times slower, so a debug build's storage would
# miss the writer's two-millisecond budget that the record drill holds it to.
[profile.dev.package.libsqlite3-sys]
opt-level = 3

[profile.release]
debug = "line-tables-only"
# Optimized for size (user 2026-11-15): the kernel's code is most of every
# installer, and most of that is the instances of serde's, the drop glue's
# and async state machines' generic code, a sixth smaller so
# (codex-8c21a7a9's probe). The leaves whose speed the drills and the bench
# hold to, SQLite's writes, hashing and compression, keep `3` below: little
# generic code, so little size.
opt-level = "s"

[profile.release.package.libsqlite3-sys]
opt-level = 3

[profile.release.package.sha2]
opt-level = 3

[profile.release.package.sha1]
opt-level = 3

[profile.release.package.xxhash-rust]
opt-level = 3

[profile.release.package.zstd-sys]
opt-level = 3

[profile.release.package.miniz_oxide]
opt-level = 3

[profile.release.package.crc32fast]
opt-level = 3

[profile.release.package.ring]
opt-level = 3

# The storage drills' own build (CI's storage jobs). They hold the storage to
# its budgets, so its code is optimized as a release's speed-critical code
# is (`3`, not the release's "s"). Nothing of it ships: its local ThinLTO,
# about a quarter of the node's build on a runner (codex-a92eb3c2's
# measure: 840 s to 628 s), is left out; optimizing less saved a tenth and
# would cost the budgets.
[profile.drill]
inherits = "release"
opt-level = 3
lto = "off"
debug = false
