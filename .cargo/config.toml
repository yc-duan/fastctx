# A download that fails for a moment, as a build machine's name lookup now and then does, is tried
# again for a while instead of failing the build.
[net]
retry = 10

# The bundled SQLite has its pre-update hook, through which a database's
# writer keeps its rules on every row it changes (`fastctx-storage`, guard).
[env]
LIBSQLITE3_FLAGS = "-DSQLITE_ENABLE_PREUPDATE_HOOK"

