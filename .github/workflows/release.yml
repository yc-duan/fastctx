name: Release

# Every platform's installer from one commit: the command-line programs built and run on the machines
# they are for; World's installers carrying those very programs; each package signed bound to the
# release's version; and the manifest the updater reads. Nothing goes to npm.
#
# A release is built once (AGENTS.md, 发版). A push to a ci/ branch builds, signs and tests every
# platform's programs: each program's smoke test on the machines it is for, on Linux once more as an
# old kernel, the installers installed and opened, the updater taking a later version, the interface
# reading what the World writes, and the drills (the network drill against the earlier release, the
# concurrency drill, the guardians' renewal, and the bundled ripgrep, the node's lifetime, job
# control and byte streams); what a release publishes is kept as its `release` artifact. A version
# tag on that very commit builds nothing: it publishes that run's artifact once every job of the run
# has passed.
#
# The notices the programs carry are the tree's own (`dist/THIRD_PARTY_LICENSES.md`), so no build
# waits for them; the notices job writes them again, and nothing is released when they differ. The
# compiled dependencies come from the caches `warm.yml` leaves on main after a release, since a tag's
# run reads only its own caches and the default branch's; this workflow saves none.
#
# Independent compilation starts together. Only bundling waits for the kernels and the prepared
# application, through same-run artifacts and `needs`; no job polls the Actions API. Native drills
# run beside bundling, and every check must pass before the run can be published.
# The machines that compile fastest compile for their slower siblings: both Mac kernels and applications
# are built on Apple silicon and both Windows ones on ARM64 Windows, Intel's and x64's as cross builds,
# and an Intel Mac and an x64 Windows machine run those very kernels, tests and applications.

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: ['ci/**']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAURI_CLI: '@tauri-apps/cli@2.12.1'
  # The release before this one: the network drill runs its hub with this one's machines, and its
  # node on this one's hub, from its Linux package.
  EARLIER_RELEASE: 1.0.1-beta.12
  # The drills run on a ci/ branch, never for a version tag.
  DRILLS: ${{ github.ref_type == 'branch' }}

jobs:
  # The notices in the tree must be the ones scripts/notices.py writes for it; when they are not,
  # nothing is released and the ones to commit are uploaded.
  notices:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rust-docs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/cargo-about.py
      - run: cargo fetch --locked
      - name: Write the notices again and compare them with the tree's
        run: |
          # The syntax definitions' notices are data two-face carries; an unoptimized build prints the same.
          cargo run --locked -p fastctx-tui --example syntax_notices > "$RUNNER_TEMP/syntax-notices.md"
          python scripts/notices.py --syntax-notices "$RUNNER_TEMP/syntax-notices.md" \
            --output "$RUNNER_TEMP/notices/THIRD_PARTY_LICENSES.md"
          if ! cmp -s "$RUNNER_TEMP/notices/THIRD_PARTY_LICENSES.md" dist/THIRD_PARTY_LICENSES.md; then
            echo "::error::dist/THIRD_PARTY_LICENSES.md is not what scripts/notices.py writes for this tree; commit the one this run uploads"
            exit 1
          fi
      - if: failure()
        name: Upload the notices this tree should carry
        uses: actions/upload-artifact@v4
        with:
          name: notices
          path: ${{ runner.temp }}/notices/THIRD_PARTY_LICENSES.md
          if-no-files-found: ignore

  kernel-windows:
    if: github.ref_type == 'branch'
    name: kernel ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, aarch64-pc-windows-msvc]
    runs-on: windows-11-arm
    defaults:
      run:
        shell: bash
    env:
      RUSTFLAGS: '-C target-feature=+crt-static'
    steps:
      - uses: actions/checkout@v4
      # These machines scan every file as it is written, and keep scanning a build's thousands of new files
      # long after it: what runs next waits behind them. The build's own files need no scan.
      - name: Keep the antivirus off the build's own files
        shell: pwsh
        run: Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, "$env:USERPROFILE\.cargo", "$env:USERPROFILE\.rustup"
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: kernel-${{ matrix.target }}
          save-if: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - if: env.DRILLS == 'true'
        run: node scripts/check-launcher.cjs "$RUNNER_TEMP"
      - run: node scripts/kernel.mjs '${{ matrix.target }}'
      - name: Verify version and package the native program
        run: |
          binary="target/${{ matrix.target }}/release/fastctx.exe"
          version="$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          test "$("$binary" --version)" = "fastctx $version"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then test "$GITHUB_REF_NAME" = "v$version"; fi
          python scripts/package.py platform --target '${{ matrix.target }}' --binary "$binary" --notices dist/THIRD_PARTY_LICENSES.md --output dist
          mkdir -p kernel && cp "$binary" kernel/
      - name: Upload the kernel
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.target }}
          path: kernel/fastctx.exe
          if-no-files-found: error
      - name: Upload the archive
        uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: dist/fastctx-*.zip
          if-no-files-found: error
      - if: env.DRILLS == 'true'
        name: Build the release tests
        run: node scripts/kernel.mjs --tests '${{ matrix.target }}' tests
      - if: env.DRILLS == 'true'
        name: Upload the tests
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.target }}
          path: tests
          if-no-files-found: error

  network-windows:
    needs: kernel-windows
    name: network ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Keep the antivirus off the build's own files
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        run: Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, "$env:USERPROFILE\.cargo", "$env:USERPROFILE\.rustup"
      - uses: actions/download-artifact@v4
        with:
          name: tests-${{ matrix.target }}
          path: tests
      - if: env.DRILLS == 'true'
        name: Network drill
        run: tests/network_drill.exe --root "$(cygpath -m "$RUNNER_TEMP")"

  test-windows-arm:
    needs: kernel-windows
    runs-on: windows-11-arm
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Keep the antivirus off the build's own files
        shell: pwsh
        run: Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, "$env:USERPROFILE\.cargo", "$env:USERPROFILE\.rustup"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: kernel-aarch64-pc-windows-msvc
          path: kernel
      - uses: actions/download-artifact@v4
        with:
          name: tests-aarch64-pc-windows-msvc
          path: tests
      - name: Smoke test on this machine
        run: python scripts/smoke.py kernel/fastctx.exe
      - name: Verify the bundled ripgrep, the node's lifetime, job control and byte streams
        run: |
          python scripts/ripgrep.py verify
          export FASTCTX_TEST_BASH="$(cygpath -m /usr/bin/bash.exe)"
          export FASTCTX_TEST_ROOT="$(cygpath -m "$RUNNER_TEMP")"
          tests/offline.exe
          tests/own_lifetime.exe
          tests/job_lifecycle.exe

  windows-x64:
    needs: kernel-windows
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: kernel-x86_64-pc-windows-msvc
          path: kernel
      - uses: actions/download-artifact@v4
        with:
          name: archive-x86_64-pc-windows-msvc
          path: archive
      - if: env.DRILLS == 'true'
        uses: actions/download-artifact@v4
        with:
          name: tests-x86_64-pc-windows-msvc
          path: tests
      - name: Smoke test on an x64 machine, with a managed computer installed as SYSTEM
        run: python scripts/smoke.py kernel/fastctx.exe --managed archive/fastctx-x86_64-pc-windows-msvc.zip
      # A real Codex app-server whose model is a mock on this machine: no
      # request goes to any vendor (`scripts/concurrency.py`). The node finds
      # Codex on the user's PATH as the system keeps it.
      - if: env.DRILLS == 'true'
        name: Concurrency and lifecycle drill
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'codex-bin'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Invoke-WebRequest 'https://github.com/openai/codex/releases/download/rust-v0.160.0/codex-x86_64-pc-windows-msvc.exe' -OutFile (Join-Path $dir 'codex.exe')
          [Environment]::SetEnvironmentVariable('Path', "$dir;" + [Environment]::GetEnvironmentVariable('Path', 'User'), 'User')
          $env:Path = "$dir;$env:Path"
          python scripts/concurrency.py kernel/fastctx.exe --codex (Join-Path $dir 'codex.exe') --minutes 4 --restarts --root $env:RUNNER_TEMP
      - if: env.DRILLS == 'true'
        name: Verify the bundled ripgrep, the node's lifetime, job control and byte streams
        run: |
          python scripts/ripgrep.py verify
          export FASTCTX_TEST_BASH="$(cygpath -m /usr/bin/bash.exe)"
          export FASTCTX_TEST_ROOT="$(cygpath -m "$RUNNER_TEMP")"
          tests/offline.exe
          tests/own_lifetime.exe
          tests/job_lifecycle.exe

  install-windows-x64:
    needs: [kernel-windows, bundle-windows]
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: kernel-x86_64-pc-windows-msvc
          path: kernel
      - uses: actions/download-artifact@v4
        with:
          name: gui-windows-x64
          path: dist/gui
      - name: Install it and open it
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist/gui/*-setup.exe | Select-Object -First 1
          Start-Process $installer.FullName -ArgumentList '/S' -Wait
          $app = Join-Path $env:LOCALAPPDATA 'Fastctx/fastctx-app.exe'
          if (-not (Test-Path $app)) { throw "the installer left no $app" }
          $kernel = Join-Path $env:LOCALAPPDATA 'Fastctx/fastctx.exe'
          if ((Get-FileHash $kernel).Hash -ne (Get-FileHash kernel/fastctx.exe).Hash) { throw "the installed kernel is not the one this run built and tested" }
          if (-not (Test-Path "$kernel.sig")) { throw "the installer left no signature beside the kernel" }
          & $kernel --version
          $process = Start-Process $app -PassThru
          Start-Sleep -Seconds 25
          if ($process.HasExited) { throw "Fastctx exited with $($process.ExitCode)" }
          & scripts/window-shot.ps1 -ProcessId $process.Id -Path "shots/windows-x64.png"
          Stop-Process -Id $process.Id
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shot-windows-x64
          path: shots
          if-no-files-found: ignore

  kernel-linux:
    if: github.ref_type == 'branch'
    name: kernel ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            build: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            build: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          targets: ${{ matrix.build }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: kernel-${{ matrix.target }}
          save-if: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install zig and cargo-zigbuild
        run: |
          python -m pip install ziglang==0.14.1
          cargo install --locked cargo-zigbuild --version 0.23.0
          # The kernel's debug sections and symbols are stripped with zig itself, which pip installs as a module.
          mkdir -p "$RUNNER_TEMP/zig-bin"
          printf '#!/bin/sh\nexec %s -m ziglang "$@"\n' "$(command -v python)" > "$RUNNER_TEMP/zig-bin/zig"
          chmod +x "$RUNNER_TEMP/zig-bin/zig"
          echo "$RUNNER_TEMP/zig-bin" >> "$GITHUB_PATH"
      - if: env.DRILLS == 'true'
        run: node scripts/check-launcher.cjs "$RUNNER_TEMP"
      - run: node scripts/kernel.mjs '${{ matrix.target }}'
      - name: Verify version and package the native program
        run: |
          binary="target/${{ matrix.build }}/release/fastctx"
          version="$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          test "$("$binary" --version)" = "fastctx $version"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then test "$GITHUB_REF_NAME" = "v$version"; fi
          python scripts/package.py platform --target '${{ matrix.target }}' --binary "$binary" --notices dist/THIRD_PARTY_LICENSES.md --output dist
          mkdir -p kernel && cp "$binary" kernel/
      - name: Upload the kernel
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.target }}
          path: kernel/fastctx
          if-no-files-found: error
      - name: Upload the archive
        uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: dist/fastctx-*.tar.gz
          if-no-files-found: error
      - name: Build the release tests
        run: node scripts/kernel.mjs --tests '${{ matrix.target }}' tests
      - name: Placement drill
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap iproute2 util-linux
          mkdir -p "$RUNNER_TEMP/placement-codex"
          curl -fsSL -o "$RUNNER_TEMP/placement-codex.tar.gz" "https://github.com/openai/codex/releases/download/rust-v0.160.0/codex-x86_64-unknown-linux-musl.tar.gz"
          echo "306865417d4ee7a927785852910a527f41e1e159add390ac5ae3accb67d44a13  $RUNNER_TEMP/placement-codex.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/placement-codex.tar.gz" -C "$RUNNER_TEMP/placement-codex"
          python scripts/placement.py --kernel "$PWD/target/${{ matrix.build }}/release/fastctx" --drill "$PWD/tests/placement_drill" --codex "$RUNNER_TEMP/placement-codex/codex-x86_64-unknown-linux-musl" --root /tmp/placement-drill
      - name: Upload the tests
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.target }}
          path: tests
          if-no-files-found: error

  network-linux:
    needs: kernel-linux
    name: network ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tests-${{ matrix.target }}
          path: tests
      - name: Restore executable permissions
        run: chmod +x tests/*
      # With the earlier release's hub and node too, where its Linux package runs.
      - if: env.DRILLS == 'true'
        name: Network drill
        run: |
          earlier=()
          if [[ "$(uname -m)" == x86_64 ]]; then
            curl -fsSL -o "$RUNNER_TEMP/earlier.deb" \
              "https://github.com/${{ github.repository }}/releases/download/v$EARLIER_RELEASE/Fastctx_${EARLIER_RELEASE}_amd64.deb"
            dpkg-deb -x "$RUNNER_TEMP/earlier.deb" "$RUNNER_TEMP/earlier"
            earlier=(--earlier "$RUNNER_TEMP/earlier/usr/bin/fastctx")
          fi
          tests/network_drill --root "$RUNNER_TEMP" "${earlier[@]}"

  test-linux:
    needs: kernel-linux
    name: test ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: kernel-${{ matrix.target }}
          path: kernel
      - uses: actions/download-artifact@v4
        with:
          name: tests-${{ matrix.target }}
          path: tests
      - name: Restore executable permissions
        run: chmod +x kernel/fastctx tests/*
      - name: Smoke test on this machine
        run: python scripts/smoke.py kernel/fastctx --service
      # The World's Claude plugin, as this kernel writes it, through Claude Code's own scanner and plugin
      # tests: a module the scanner refuses does not load at all, and nothing of ours would see it.
      - if: matrix.target == 'x86_64-unknown-linux-gnu'
        name: The Claude plugin loads in Claude Code
        run: python scripts/claude-plugin.py kernel/fastctx
      # The servers people bring are often far older than this one. The same smoke test runs again
      # with every system call Linux 3.13 lacked answering ENOSYS, and what CentOS 7's kernel has but
      # refuses as invalid refused so, as such a kernel answers them, so a call the World makes with
      # no way for an old kernel stops the release. As root, since a program kept from new
      # privileges cannot sudo.
      - if: matrix.target == 'x86_64-unknown-linux-gnu'
        name: Smoke test as an old kernel
        run: |
          gcc -O2 -o "$RUNNER_TEMP/oldkernel" scripts/oldkernel.c
          sudo python3 scripts/oldkernel-smoke.py "$RUNNER_TEMP/oldkernel" kernel/fastctx --root "$RUNNER_TEMP/oldkernel-smoke"
      # A real Codex app-server whose model is a mock on this machine: no
      # request goes to any vendor (`scripts/concurrency.py`). The node finds
      # Codex on the login PATH.
      - if: env.DRILLS == 'true'
        name: Concurrency and lifecycle drill
        run: |
          arch="$(uname -m)"
          curl -fsSL "https://github.com/openai/codex/releases/download/rust-v0.160.0/codex-${arch}-unknown-linux-musl.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          sudo install -m 0755 "$RUNNER_TEMP/codex-${arch}-unknown-linux-musl" /usr/local/bin/codex
          python scripts/concurrency.py kernel/fastctx --codex /usr/local/bin/codex --minutes 4 --restarts --root "$RUNNER_TEMP"
      - if: env.DRILLS == 'true'
        name: Verify the bundled ripgrep, the node's lifetime, job control and byte streams
        run: |
          python scripts/ripgrep.py verify
          export FASTCTX_TEST_BASH=/bin/bash FASTCTX_TEST_ROOT="$RUNNER_TEMP"
          tests/offline
          tests/own_lifetime
          tests/job_lifecycle

  old-linux:
    if: github.ref_type == 'branch'
    needs: kernel-linux
    name: CentOS 7 lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: kernel-x86_64-unknown-linux-gnu
          path: kernel
      - name: Install the virtual machine tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils genisoimage
          if [[ -e /dev/kvm ]]; then sudo chown "$USER" /dev/kvm; fi
      - uses: actions/cache@v4
        with:
          path: .old-linux-cache
          key: centos7-2009-7ba4513d-python31117-v1
      - name: Exercise the published kernel on the old system
        if: env.DRILLS == 'true'
        run: python scripts/old-linux.py kernel/fastctx --cache .old-linux-cache --work "$RUNNER_TEMP/centos7"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: centos7-lifecycle-logs
          path: |
            ${{ runner.temp }}/centos7/*.log
            ${{ runner.temp }}/centos7/result.json
          if-no-files-found: warn

  kernel-macos:
    if: github.ref_type == 'branch'
    name: kernel ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          targets: ${{ matrix.target }}
      - if: matrix.target == 'x86_64-apple-darwin'
        name: Let Apple silicon run what is built for Intel
        run: softwareupdate --install-rosetta --agree-to-license || /usr/bin/arch -x86_64 /usr/bin/true
      - uses: Swatinem/rust-cache@v2
        with:
          key: kernel-${{ matrix.target }}
          save-if: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - if: env.DRILLS == 'true'
        run: node scripts/check-launcher.cjs "$RUNNER_TEMP"
      - run: node scripts/kernel.mjs '${{ matrix.target }}'
      - name: Verify version and package the native program
        run: |
          binary="target/${{ matrix.target }}/release/fastctx"
          version="$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          test "$("$binary" --version)" = "fastctx $version"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then test "$GITHUB_REF_NAME" = "v$version"; fi
          python scripts/package.py platform --target '${{ matrix.target }}' --binary "$binary" --notices dist/THIRD_PARTY_LICENSES.md --output dist
          mkdir -p kernel && cp "$binary" kernel/
      - name: Upload the kernel
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.target }}
          path: kernel/fastctx
          if-no-files-found: error
      - name: Upload the archive
        uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: dist/fastctx-*.tar.gz
          if-no-files-found: error
      - if: env.DRILLS == 'true'
        name: Build the release tests
        run: node scripts/kernel.mjs --tests '${{ matrix.target }}' tests
      - if: env.DRILLS == 'true'
        name: Upload the tests
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.target }}
          path: tests
          if-no-files-found: error

  network-macos:
    needs: kernel-macos
    name: network ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Use the bash a Mac comes with
        if: matrix.target == 'x86_64-apple-darwin'
        run: |
          for bash in /opt/homebrew/bin/bash /usr/local/bin/bash; do
            if [ -e "$bash" ]; then sudo mv "$bash" "$bash.hidden"; fi
          done
          /bin/bash --version | head -1
      - uses: actions/download-artifact@v4
        with:
          name: tests-${{ matrix.target }}
          path: tests
      - name: Restore executable permissions
        run: chmod +x tests/*
      - if: env.DRILLS == 'true'
        name: Network drill
        run: tests/network_drill --root "$RUNNER_TEMP"

  test-macos-arm:
    needs: kernel-macos
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: kernel-aarch64-apple-darwin
          path: kernel
      - uses: actions/download-artifact@v4
        with:
          name: archive-aarch64-apple-darwin
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: tests-aarch64-apple-darwin
          path: tests
      - name: Restore executable permissions
        run: chmod +x kernel/fastctx tests/*
      - name: Smoke test on this machine, with a managed Mac installed as root
        run: python scripts/smoke.py kernel/fastctx --service --managed dist/fastctx-aarch64-apple-darwin.tar.gz
      - name: Verify the bundled ripgrep, the node's lifetime, job control and byte streams, in the bash a Mac comes with
        run: |
          python scripts/ripgrep.py verify
          export FASTCTX_TEST_BASH=/bin/bash FASTCTX_TEST_ROOT="$RUNNER_TEMP"
          tests/offline
          tests/own_lifetime
          tests/job_lifecycle

  macos-intel:
    needs: [kernel-macos, bundle-macos]
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Use the bash a Mac comes with
        run: |
          for bash in /opt/homebrew/bin/bash /usr/local/bin/bash; do
            if [ -e "$bash" ]; then sudo mv "$bash" "$bash.hidden"; fi
          done
          /bin/bash --version | head -1
      - uses: actions/download-artifact@v4
        with:
          name: kernel-x86_64-apple-darwin
          path: kernel
      - if: env.DRILLS == 'true'
        uses: actions/download-artifact@v4
        with:
          name: tests-x86_64-apple-darwin
          path: tests
      - uses: actions/download-artifact@v4
        with:
          name: gui-macos-x64
          path: dist
      - name: Smoke test on an Intel Mac
        run: |
          chmod +x kernel/fastctx
          python scripts/smoke.py kernel/fastctx --service --expect-bash 3.2
      - if: env.DRILLS == 'true'
        name: Verify the bundled ripgrep, the node's lifetime, job control and byte streams
        run: |
          chmod +x tests/*
          python scripts/ripgrep.py verify
          export FASTCTX_TEST_BASH=/bin/bash FASTCTX_TEST_ROOT="$RUNNER_TEMP"
          tests/offline
          tests/own_lifetime
          tests/job_lifecycle
      - name: Open the application
        run: |
          tar -xzf dist/*.app.tar.gz -C "$RUNNER_TEMP"
          app="$RUNNER_TEMP/Fastctx.app"
          codesign --verify --verbose "$app"
          # The bundle signs what it carries again, so its bytes differ; it is the program built here
          # when it has the UUID the linker derived from that program's content.
          uuid() { dwarfdump --uuid "$1" | awk '{ print $2 }'; }
          built="$(uuid kernel/fastctx)" && test -n "$built"
          test "$(uuid "$app/Contents/MacOS/fastctx")" = "$built"
          "$app/Contents/MacOS/fastctx" --version
          "$app/Contents/MacOS/fastctx-app" > app.log 2>&1 &
          sleep 25
          pgrep -x fastctx-app
          mkdir -p shots
          screencapture -x shots/macos-x64.png || true
          pkill -x fastctx-app || true
          cat app.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shot-macos-x64
          path: shots
          if-no-files-found: ignore


  sign-kernels:
    needs: [kernel-linux, kernel-windows, bundle-macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*-unknown-linux-gnu
          merge-multiple: true
          path: kernels
      # Windows computers installed by their line take their updates as the
      # Linux ones do; Windows on Arm runs the x64 program.
      - uses: actions/download-artifact@v4
        with:
          name: archive-x86_64-pc-windows-msvc
          path: kernels
      # A Mac's, Apple silicon and Intel, as the application carries it.
      - uses: actions/download-artifact@v4
        with:
          pattern: signed-archive-*-apple-darwin
          merge-multiple: true
          path: kernels
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/checkout@v4
        with:
          path: source
      - name: Sign the Linux, Windows and Mac command-line programs
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("source/Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          # A Windows computer's boot service takes a newer program by the
          # program's own signature; a package's signs the archive. The
          # program's goes into the archive, which is signed after it.
          (cd kernels \
            && unzip -q -o fastctx-x86_64-pc-windows-msvc.zip fastctx.exe \
            && npx --yes "$TAURI_CLI" signer sign --app-version "$version" fastctx.exe \
            && zip -q fastctx-x86_64-pc-windows-msvc.zip fastctx.exe.sig \
            && rm fastctx.exe fastctx.exe.sig)
          for archive in kernels/fastctx-*-unknown-linux-gnu.tar.gz kernels/fastctx-x86_64-pc-windows-msvc.zip \
              kernels/fastctx-*-apple-darwin.tar.gz; do
            npx --yes "$TAURI_CLI" signer sign --app-version "$version" "$archive"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: signed-kernels
          path: |
            kernels/fastctx-*-unknown-linux-gnu.tar.gz*
            kernels/fastctx-x86_64-pc-windows-msvc.zip*
            kernels/fastctx-*-apple-darwin.tar.gz*
          if-no-files-found: error

  gui-windows:
    if: github.ref_type == 'branch'
    name: gui ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: aarch64-pc-windows-msvc
            arch: arm64
    runs-on: windows-11-arm
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # These machines scan every file as it is written, and keep scanning a build's thousands of new files
      # long after it: what runs next waits behind them. The build's own files need no scan.
      - name: Keep the antivirus off the build's own files
        shell: pwsh
        run: Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, "$env:USERPROFILE\.cargo", "$env:USERPROFILE\.rustup"
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rust-docs
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui/src-tauri
          key: gui-${{ matrix.target }}
          save-if: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/cargo-about.py
      - name: Fetch the application's dependencies
        working-directory: gui
        run: |
          npm ci --no-audit --no-fund
          cargo fetch --locked --manifest-path src-tauri/Cargo.toml
      - name: Compile the application
        working-directory: gui
        run: node scripts/release.mjs --prepare --kernel-signed --target '${{ matrix.target }}'
      - name: Archive the prepared application
        run: python scripts/gui-prepared.py '${{ matrix.target }}' prepared/gui.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: prepared-${{ matrix.target }}
          path: prepared/gui.tar.gz
          compression-level: 0
          if-no-files-found: error

  bundle-windows:
    needs: [gui-windows, kernel-windows, kernel-linux]
    name: bundle ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: aarch64-pc-windows-msvc
            arch: arm64
    runs-on: windows-11-arm
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # These machines scan every file as it is written, and keep scanning a build's thousands of new files
      # long after it: what runs next waits behind them. The build's own files need no scan.
      - name: Keep the antivirus off the build's own files
        shell: pwsh
        run: Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, "$env:USERPROFILE\.cargo", "$env:USERPROFILE\.rustup"
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the bundler
        working-directory: gui
        run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: prepared-${{ matrix.target }}
          path: prepared
      - name: Restore the prepared application
        run: tar -xzf prepared/gui.tar.gz
      - uses: actions/download-artifact@v4
        with:
          name: kernel-${{ matrix.target }}
          path: kernel
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*-unknown-linux-gnu
          merge-multiple: true
          path: gui/src-tauri/linux
      # The boot service takes a new release's kernel by this signature alone, with no administrator.
      - name: Sign the World program it carries
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        working-directory: gui
        run: |
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          node node_modules/@tauri-apps/cli/tauri.js signer sign --app-version "$version" ../kernel/fastctx.exe
      - name: Build the installer
        working-directory: gui
        run: node scripts/release.mjs --prepared --kernel-signed --kernel ../kernel/fastctx.exe --target '${{ matrix.target }}' --out ../dist/gui
      - name: Sign the installer for the updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        working-directory: gui
        run: |
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          for installer in ../dist/gui/*-setup.exe; do
            node node_modules/@tauri-apps/cli/tauri.js signer sign --app-version "$version" "$installer"
          done
      - if: matrix.arch == 'arm64'
        name: Install it and open it
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist/gui/*-setup.exe | Select-Object -First 1
          Start-Process $installer.FullName -ArgumentList '/S' -Wait
          $app = Join-Path $env:LOCALAPPDATA 'Fastctx/fastctx-app.exe'
          if (-not (Test-Path $app)) { throw "the installer left no $app" }
          $kernel = Join-Path $env:LOCALAPPDATA 'Fastctx/fastctx.exe'
          if ((Get-FileHash $kernel).Hash -ne (Get-FileHash kernel/fastctx.exe).Hash) { throw "the installed kernel is not the one this run built and tested" }
          if ((Get-Content "$kernel.sig" -Raw) -ne (Get-Content kernel/fastctx.exe.sig -Raw)) { throw "the installed kernel's signature is not the one this run made" }
          & $kernel --version
          $process = Start-Process $app -PassThru
          Start-Sleep -Seconds 25
          if ($process.HasExited) { throw "Fastctx exited with $($process.ExitCode)" }
          & scripts/window-shot.ps1 -ProcessId $process.Id -Path "shots/windows-${{ matrix.arch }}.png"
          Stop-Process -Id $process.Id
      - uses: actions/upload-artifact@v4
        if: always() && matrix.arch == 'arm64'
        with:
          name: shot-windows-${{ matrix.arch }}
          path: shots
          if-no-files-found: ignore
      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: gui-windows-${{ matrix.arch }}
          path: dist/gui/*-setup.exe*
          if-no-files-found: error

