name: Release

# Pushing a tag is a push event, so GitHub applies the skip markers ([skip ci],
# [ci skip], [no ci], [skip actions], [actions skip]) from the message of the
# commit the tag points at. A release commit carrying one silently suppresses
# this entire workflow: the tag lands, no build runs, and no release appears.
# Keep those markers out of any commit that a release tag will point at.
# 2026-07-19: this happened once and cost a tag delete plus a re-tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

# The pinned Pdfium archive is a build input rather than a build output, so it belongs
# in its own cache instead of the Cargo one. A tag build cannot be shrugged off and
# retried the way a branch build can, and the release CDN it comes from does go down,
# so this job fetches it once per pinning. Absolute, so every step resolves the same
# directory whatever working directory Cargo hands the build script.
env:
  FASTCTX_PDFIUM_CACHE_DIR: ${{ github.workspace }}/.pdfium-archive-cache

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: fastctx.exe
            archive: fastctx-x86_64-pc-windows-msvc.zip
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            binary: fastctx.exe
            archive: fastctx-aarch64-pc-windows-msvc.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            zig_target: x86_64-unknown-linux-gnu.2.31
            binary: fastctx
            archive: fastctx-x86_64-unknown-linux-gnu.tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: fastctx
            archive: fastctx-x86_64-apple-darwin.tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            binary: fastctx
            archive: fastctx-aarch64-apple-darwin.tar.gz

    steps:
      - name: Prepare Git Bash temporary directories
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $git = (Get-Command git.exe -ErrorAction Stop).Source
          $cursor = Split-Path $git -Parent
          $gitRoot = $null
          while ($cursor) {
            if (Test-Path (Join-Path $cursor "usr/bin/bash.exe")) {
              $gitRoot = $cursor
              break
            }
            $parent = Split-Path $cursor -Parent
            if (-not $parent -or $parent -eq $cursor) { break }
            $cursor = $parent
          }
          if (-not $gitRoot) { throw "Cannot locate the Git for Windows root from $git" }
          $bash = Join-Path $gitRoot "usr/bin/bash.exe"
          # Git Bash resolves POSIX /tmp through a runtime "usertemp" mount. That
          # mount ignores TEMP/TMP/TMPDIR and cannot be redirected from fstab, so
          # the target is whatever cygpath reports and nothing else. When it is
          # missing every bash start writes a warning to stderr, that warning is
          # captured as command output, and byte-exact output assertions fail.
          # Ask bash for the path instead of guessing it. (2026-07-25)
          # usr/bin/bash.exe inherits PATH from the caller, and pwsh does not
          # carry the Git toolset, so /usr/bin has to be put back by hand or
          # cygpath and mkdir below resolve to nothing.
          $posixTemp = (& $bash --noprofile --norc -c 'PATH=/usr/bin:/bin:$PATH; cygpath -w /tmp').Trim()
          if ([string]::IsNullOrWhiteSpace($posixTemp)) {
            throw "Git Bash did not report a Windows path for POSIX /tmp"
          }
          Write-Host "POSIX /tmp resolves to $posixTemp"
          $tempPaths = @(
            $posixTemp
            (Join-Path $gitRoot "tmp")
            $env:TEMP
            $env:TMP
            [System.IO.Path]::GetTempPath()
            (Join-Path $env:USERPROFILE "AppData/Local/Temp")
            (Join-Path $env:LOCALAPPDATA "Temp")
          ) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) } | Sort-Object -Unique
          foreach ($path in $tempPaths) {
            New-Item -ItemType Directory -Force -Path $path | Out-Null
          }
          # Existence alone is not the bar: bash wants a directory it can write.
          & $bash --noprofile --norc -c 'PATH=/usr/bin:/bin:$PATH; mkdir -p /tmp && printf probe > /tmp/.fastctx-probe && rm -f /tmp/.fastctx-probe'
          if ($LASTEXITCODE -ne 0) {
            throw "Git Bash could not create and write inside its POSIX /tmp directory"
          }
          # Fail here rather than eight minutes later inside the test matrix:
          # any startup chatter would be captured as command output downstream.
          $noiseLog = Join-Path ([System.IO.Path]::GetTempPath()) "gitbash-startup-noise.txt"
          & $bash --noprofile --norc -c "true" 2>$noiseLog
          $noise = Get-Content -LiteralPath $noiseLog -Raw -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $noiseLog -Force -ErrorAction SilentlyContinue
          if (-not [string]::IsNullOrWhiteSpace($noise)) {
            throw "Git Bash still writes startup noise to stderr: $noise"
          }
          # Creating the directory once is not enough: it has gone missing partway
          # through a job, after this step had already verified it. Windows refuses
          # to remove a directory that holds an open handle, so park one inside it
          # for the rest of the job and rebuild the directory if it disappears
          # regardless. Fire and forget - if the keeper fails to start, the job
          # behaves exactly as it did before. The log is the evidence trail.
          # Keep the keeper's own files off the directory it is guarding.
          $runnerTemp = if ([string]::IsNullOrWhiteSpace($env:RUNNER_TEMP)) { [System.IO.Path]::GetTempPath() } else { $env:RUNNER_TEMP }
          $keeperLog = Join-Path $runnerTemp "posix-tmp-keeper.log"
          "watching $posixTemp from $(Get-Date -Format o)" | Set-Content -LiteralPath $keeperLog -Encoding UTF8
          $keeperBody = @'
          param([string]$Target, [string]$LogPath)
          $stream = $null
          while ($true) {
            try {
              if (-not (Test-Path -LiteralPath $Target)) {
                if ($stream) { $stream.Dispose(); $stream = $null }
                New-Item -ItemType Directory -Force -Path $Target | Out-Null
                Add-Content -LiteralPath $LogPath -Value ("recreated " + (Get-Date -Format o))
              }
              if (-not $stream) {
                $anchor = Join-Path $Target ".posix-tmp-keeper"
                $stream = [System.IO.File]::Open($anchor, "OpenOrCreate", "ReadWrite", "None")
                Add-Content -LiteralPath $LogPath -Value ("anchored " + (Get-Date -Format o))
              }
            } catch {
              Add-Content -LiteralPath $LogPath -Value ("error " + (Get-Date -Format o) + " " + $_.Exception.Message)
            }
            Start-Sleep -Milliseconds 200
          }
          '@
          $keeper = Join-Path $runnerTemp "posix-tmp-keeper.ps1"
          Set-Content -LiteralPath $keeper -Value $keeperBody -Encoding UTF8
          Start-Process pwsh -WindowStyle Hidden -ArgumentList @(
            "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", $keeper,
            "-Target", $posixTemp, "-LogPath", $keeperLog
          )

      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install pinned Zig
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.14.1
      - name: Install pinned cargo-zigbuild
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo install cargo-zigbuild --locked --version 0.23.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Cache the pinned Pdfium archive
        uses: actions/cache@v4
        with:
          path: .pdfium-archive-cache
          key: pdfium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.rs') }}

      - name: Test release contracts
        run: cargo test --locked --release --target ${{ matrix.target }}

      # The contract tests above leave control centers riding out their idle window and detached
      # job supervisors finishing their commands. Windows cannot replace a mapped binary, so the
      # release build below fails with os error 5 while relinking the same path. CI drains between
      # its test groups for the same reason; this job relinks right after a test group too.
      - name: Drain test processes before the release build
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/drain-test-processes.ps1

      - name: Build single-file executable
        if: matrix.target != 'x86_64-unknown-linux-gnu'
        env:
          FASTCTX_DISTRIBUTION: github-release
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Build glibc 2.31 Linux executable
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        env:
          FASTCTX_DISTRIBUTION: github-release
        run: cargo zigbuild --locked --release --target ${{ matrix.zig_target }}

      - name: Enforce Linux GLIBC symbol floors
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail

          highest_glibc() {
            local file="$1"
            LANG=C readelf -W --version-info --dyn-syms "$file" |
              sed -nE 's/.*Name: GLIBC_([0-9]+(\.[0-9]+)+).*/\1/p' |
              sort -Vu |
              tail -n 1
          }

          version_at_most() {
            local actual="$1"
            local maximum="$2"
            [[ "$(printf '%s\n%s\n' "$actual" "$maximum" | sort -V | tail -n 1)" == "$maximum" ]]
          }

          assert_glibc_at_most() {
            local file="$1"
            local maximum="$2"
            local label="$3"
            local actual
            actual="$(highest_glibc "$file")"
            if [[ -z "$actual" ]]; then
              echo "::error::$label exposes no GLIBC version requirements"
              return 1
            fi
            if ! version_at_most "$actual" "$maximum"; then
              echo "::error::$label requires GLIBC_$actual, above GLIBC_$maximum"
              return 1
            fi
            echo "$label: highest required symbol is GLIBC_$actual (maximum GLIBC_$maximum)"
          }

          binary="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          assert_glibc_at_most "$binary" "2.31" "FastCtx Linux executable"

          if assert_glibc_at_most "$binary" "2.17" "negative-control executable"; then
            echo "::error::The GLIBC gate negative control unexpectedly accepted a 2.17 floor"
            exit 1
          fi
          echo "Negative control correctly rejected the executable at a GLIBC_2.17 floor"

          mapfile -t pdfium_libraries < <(
            find "target/${{ matrix.target }}/release/build" \
              -type f \
              -path '*/out/bundled-pdfium/libpdfium.so' \
              -print
          )
          if [[ "${#pdfium_libraries[@]}" -eq 0 ]]; then
            echo "::error::The embedded libpdfium.so build input was not found"
            exit 1
          fi
          for pdfium in "${pdfium_libraries[@]}"; do
            assert_glibc_at_most "$pdfium" "2.16" "Embedded Pdfium"
          done

      - name: Stage release archive
        shell: pwsh
        run: |
          ./scripts/stage-release-archive.ps1 `
            -Target "${{ matrix.target }}" `
            -Binary "target/${{ matrix.target }}/release/${{ matrix.binary }}"

      - name: Smoke-test Linux on glibc 2.31 and 2.35
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail
          cat > target/glibc-smoke.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          binary=/opt/fastctx
          # Every check below reports what it wanted and what it got. A bare `[[ ]]` or `grep -q`
          # under `set -e` fails the whole release with an empty log, which is how a real defect
          # here once cost an afternoon of bisecting.
          version="$("$binary" --version)"
          echo "fastctx reports: $version"
          if [[ "$version" != fastctx\ * ]]; then
            echo "::error::glibc smoke test: --version printed $version"
            exit 1
          fi
          responses="$(
            printf '%s\n' \
              '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"glibc-smoke","version":"1.0"}}}' \
              '{"jsonrpc":"2.0","method":"notifications/initialized","params":{}}' \
              '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' |
              timeout 15s "$binary" serve
          )"
          require() {
            if ! grep -Eq "$1" <<<"$responses"; then
              echo "::error::glibc smoke test: the MCP responses carry no $2"
              echo "Captured ${#responses} bytes of responses:"
              head -c 2000 <<<"$responses"
              exit 1
            fi
          }
          require '"id"[[:space:]]*:[[:space:]]*1' 'answer to initialize'
          require '"id"[[:space:]]*:[[:space:]]*2' 'answer to tools/list'
          require '"name"[[:space:]]*:[[:space:]]*"inspect_local_file"' 'inspect_local_file tool'
          require '"name"[[:space:]]*:[[:space:]]*"replace"' 'replace tool'
          SCRIPT
          chmod +x target/glibc-smoke.sh
          binary="$PWD/target/${{ matrix.target }}/release/${{ matrix.binary }}"
          probe="$PWD/target/glibc-smoke.sh"
          for image in ubuntu:20.04 ubuntu:22.04; do
            docker run --rm \
              --volume "$binary:/opt/fastctx:ro" \
              --volume "$probe:/opt/glibc-smoke:ro" \
              "$image" \
              /bin/bash /opt/glibc-smoke
          done

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Pack and verify npm artifact
        shell: pwsh
        run: |
          $version = (Select-String -LiteralPath Cargo.toml -Pattern '^version = "([^"]+)"$').Matches[0].Groups[1].Value
          $package = switch ("${{ matrix.target }}") {
            "x86_64-pc-windows-msvc" { "fastctx-win32-x64-$version.tgz" }
            "aarch64-pc-windows-msvc" { "fastctx-win32-arm64-$version.tgz" }
            "x86_64-unknown-linux-gnu" { "fastctx-linux-x64-$version.tgz" }
            "x86_64-apple-darwin" { "fastctx-darwin-x64-$version.tgz" }
            "aarch64-apple-darwin" { "fastctx-darwin-arm64-$version.tgz" }
          }
          $verificationDirectory = "target/npm-release-verification"
          ./scripts/stage-npm-package.ps1 `
            -Target "${{ matrix.target }}" `
            -Binary "target/${{ matrix.target }}/release/${{ matrix.binary }}" `
            -OutputDirectory $verificationDirectory `
            -IncludeRootPackages
          ./scripts/verify-npm-install.ps1 `
            -PlatformTarball "$verificationDirectory/$package" `
            -MainTarball "$verificationDirectory/fastctx-$version.tgz" `
            -AliasTarball "$verificationDirectory/codex-fastctx-$version.tgz"
          New-Item -ItemType Directory -Force -Path "dist/npm" | Out-Null
          Copy-Item -LiteralPath "$verificationDirectory/$package" -Destination "dist/npm/$package"

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.target }}
          path: |
            dist/release/${{ matrix.archive }}
            dist/npm/*.tgz
          if-no-files-found: error

  publish-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Pack npm launcher and compatibility alias
        shell: pwsh
        run: ./scripts/pack-npm-root.ps1 -OutputDirectory "dist/npm"
      - name: Finalize and verify release artifacts
        shell: pwsh
        run: |
          ./scripts/verify-distribution-contract.ps1
          ./scripts/finalize-release-assets.ps1
          ./scripts/verify-release-assets.ps1
      - name: Retain npm packages for manual publishing
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarballs-${{ github.ref_name }}
          path: dist/npm/*.tgz
          if-no-files-found: error
          retention-days: 90
      - name: Verify annotated release identity
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: ./scripts/verify-release-identity.ps1 -TagName $env:GITHUB_REF_NAME
      - name: Create exact GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$RUNNER_TEMP/fastctx-release-notes.md"
          cat > "$notes" <<'EOF'
          ## FastCtx v1.0.0

          Agent-native orchestration, factual head notes, and first-class connection management for nine coding agents.

          **Upgrading:** launch `fastctx` after replacing the binary and review **Agent connections**. An unchanged managed Codex connection migrates automatically; user-edited configuration or guidance is preserved and reported by Doctor instead of being overwritten.

          ### Breaking

          - **`inspect_local_file` is single-file.** The `files` request shape and batch-level `limit` are removed. Hosts can issue independent or parallel tool calls and can mix inspection with search or commands in one turn.
          - **Success responses start with facts instead of ending with verdicts.** `Complete`, `Partial`, and `Killed` terminal lines are gone. Every successful text result begins with `=== subject (metric; facts) ===`, and continuation parameters are no longer echoed in responses.
          - **Generated guidance follows the enabled tools.** New Apply output no longer uses one frozen Codex-only block. Known 0.2.x blocks migrate only on an exact ownership match.
          - **`glob` no longer applies Git ignore rules.** `.gitignore`, `.git/info/exclude`, and global Git ignore no longer hide results; `.git` is not excluded automatically. `filter_mode` is `ignore` (plain `.ignore` only) or `all`. The legacy `project` value remains accepted as `ignore`; `grep` and `replace` are unchanged.

          ### Added

          - **Nine first-class agent targets.** Connect, diagnose, and disconnect Codex / ChatGPT, Claude Code, Cursor, VS Code Copilot Agent, OpenCode, Antigravity, TraeCode CLI, ZCode, and Qoder from the TUI or CLI.
          - **Per-agent tool selection.** Choose any non-empty subset of the four file tools; the five Bash/job tools remain an atomic suite. The exact enabled set is enforced by FastCtx and recorded per target.
          - **Target-scoped ownership and recovery.** Apply and Disconnect preview one immutable transaction, detect concurrent edits, roll back failed writes, preserve unrelated host configuration, and distinguish drift, parse errors, and permission failures in Doctor.
          - **Windows on ARM.** FastCtx ships an `aarch64-pc-windows-msvc` GitHub archive and `@fastctx/win32-arm64` npm package with the same feature surface as the other builds.
          - **`glob` details output.** `output_mode: "details"` returns each path with its byte size and UTC modification time.

          ### Fixed

          - Finished background jobs no longer remain on every later response. A terminal transition is retired only after its full or compact status line actually reaches one response; budget omission cannot lose it.
          - A failing control center no longer ends the host's MCP session. The proxy settles the failed request, changes engines without replaying side effects, and continues on the same stdio transport.
          - Published tool schemas use the portable subset accepted across supported hosts, with all three approval annotations explicit for every enabled combination.
          - Background logs obey one frozen per-job log-plus-index ceiling, retain a directly readable prefix, and keep draining the child after the ceiling without falsifying its exit code.
          - Git Bash installed through Scoop is discovered, busy machines no longer cause false background-start failures, and FastCtx-owned non-interactive Windows children do not allocate console windows.
          EOF
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release delete "${GITHUB_REF_NAME}" --yes
          fi
          gh release create "${GITHUB_REF_NAME}" dist/release/* \
            --verify-tag \
            --title "FastCtx ${GITHUB_REF_NAME}" \
            --notes-file "$notes"
      - name: Confirm dry-run boundary
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "Release artifacts were built and verified without creating or replacing a GitHub Release."

  publish-npm:
    name: Publish npm packages
    needs: publish-release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted publishing exchanges this short-lived OIDC identity for a
      # registry credential. No npm token exists in this repository.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-tarballs-${{ github.ref_name }}
          path: dist/npm
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Use an npm release that supports trusted publishing
        run: npm install --global npm@latest
      - name: Publish packages in dependency order
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"

          publish_package() {
            local name="$1"
            local tarball="dist/npm/$2-${version}.tgz"
            if [[ ! -f "$tarball" ]]; then
              echo "::error::Missing tarball $tarball"
              exit 1
            fi
            # Published versions are immutable, so a partially published release
            # can only be finished by skipping what already landed. This check
            # keeps a re-run of this job safe instead of failing on E403.
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "::notice::$name@$version is already published; skipping"
              return
            fi
            echo "Publishing $name@$version"
            npm publish "$tarball" --access public
          }

          # Dependents last: the launcher's optionalDependencies must resolve.
          publish_package "@fastctx/win32-x64" "fastctx-win32-x64"
          publish_package "@fastctx/win32-arm64" "fastctx-win32-arm64"
          publish_package "@fastctx/linux-x64" "fastctx-linux-x64"
          publish_package "@fastctx/darwin-x64" "fastctx-darwin-x64"
          publish_package "@fastctx/darwin-arm64" "fastctx-darwin-arm64"
          publish_package "fastctx" "fastctx"
          publish_package "codex-fastctx" "codex-fastctx"
      - name: Confirm registry visibility
        shell: bash
        run: |
          set -uo pipefail
          version="${GITHUB_REF_NAME#v}"
          packages=(
            "@fastctx/win32-x64"
            "@fastctx/win32-arm64"
            "@fastctx/linux-x64"
            "@fastctx/darwin-x64"
            "@fastctx/darwin-arm64"
            "fastctx"
            "codex-fastctx"
          )
          # The registry read path lags publish by minutes, so absence here is a
          # propagation notice rather than a failed publish.
          lagging=()
          for name in "${packages[@]}"; do
            visible=""
            for _ in $(seq 1 10); do
              if npm view "$name@$version" version >/dev/null 2>&1; then
                visible="yes"
                break
              fi
              sleep 30
            done
            if [[ -n "$visible" ]]; then
              echo "$name@$version is visible"
            else
              lagging+=("$name")
            fi
          done
          if [[ "${#lagging[@]}" -gt 0 ]]; then
            echo "::warning::Still propagating after 5 minutes: ${lagging[*]}"
          fi
      - name: Request npmmirror synchronization
        shell: bash
        run: |
          set -uo pipefail
          # Mirrors copy new versions lazily, which strands users whose registry
          # is a mirror. This asks npmmirror to enqueue each package now; the
          # response only acknowledges the request, not its completion.
          for name in \
            "%40fastctx%2Fwin32-x64" \
            "%40fastctx%2Fwin32-arm64" \
            "%40fastctx%2Flinux-x64" \
            "%40fastctx%2Fdarwin-x64" \
            "%40fastctx%2Fdarwin-arm64" \
            "fastctx" \
            "codex-fastctx"
          do
            status="$(curl -sS -o /dev/null -w '%{http_code}' -X PUT \
              "https://registry.npmmirror.com/-/package/${name}/syncs" || echo "000")"
            if [[ "$status" == "2"* ]]; then
              echo "Sync queued for ${name} (HTTP ${status})"
            else
              echo "::warning::npmmirror sync request for ${name} returned HTTP ${status}"
            fi
          done
