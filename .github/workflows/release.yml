          merge-multiple: true
          path: gui/src-tauri/linux
      - name: Build, seal and verify the deb and the AppImage
        run: |
          chmod +x kernel/fastctx
          # linux-bundle.py checks both packages carry this very program.
          mkdir -p "$CARGO_TARGET_DIR/x86_64-unknown-linux-musl/release"
          cp kernel/fastctx "$CARGO_TARGET_DIR/x86_64-unknown-linux-musl/release/fastctx"
          cd gui
          node scripts/release.mjs --prepared --kernel ../kernel/fastctx
          python ../scripts/linux-bundle.py --target-dir "$CARGO_TARGET_DIR" --output ../dist/gui
      - name: Sign the packages for the updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        working-directory: gui
        run: |
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          for package in ../dist/gui/*.AppImage ../dist/gui/*.deb; do
            node node_modules/@tauri-apps/cli/tauri.js signer sign --app-version "$version" "$package"
          done
      - name: Open the AppImage
        run: |
          image="$(realpath dist/gui/*.AppImage)"
          chmod +x "$image"
          mkdir -p shots
          export APPIMAGE_EXTRACT_AND_RUN=1 WEBKIT_DISABLE_DMABUF_RENDERER=1
          # The application is found by its own process name, and by its window's title on the screen.
          # Its window is looked for every two seconds for two minutes, and how long it took is said;
          # when it never comes, what is on the screen and what runs are said too.
          status=0
          xvfb-run -a -s "-screen 0 1280x860x24" sh -c '
            "$1" > app.log 2>&1 &
            waited=0
            until xwininfo -root -tree | grep -qF "\"Fastctx\"" || [ $waited -ge 120 ]; do
              sleep 2
              waited=$((waited + 2))
              # GTK registering the application waits out a 25 s D-Bus timeout on this runner before
              # the window can come. Still none forty seconds in: where every thread is, beside the shot.
              if [ $waited -eq 40 ] && ! xwininfo -root -tree | grep -qF "\"Fastctx\""; then
                sudo apt-get install -y gdb > /dev/null 2>&1
                sudo gdb -p "$(pgrep -x fastctx-app | head -1)" -batch -ex "set pagination off" \
                  -ex "thread apply all bt 25" > shots/stacks-at-40s.txt 2>&1
              fi
            done
            import -window root shots/linux-x64.png
            if xwininfo -root -tree | grep -F "\"Fastctx\""; then
              shown=0
              echo "The window was there after about $waited s."
            else
              shown=1
              echo "No window after $waited s; the screen holds:"
              xwininfo -root -tree
            fi
            pgrep -x fastctx-app > /dev/null || { shown=1; echo "The application is not running."; }
            ps -eo pid,ppid,etime,stat,args | grep -iE "fastctx|webkit|apprun" | grep -v grep
            pkill -x fastctx-app
            exit $shown' sh "$image" || status=$?
          cat app.log
          if [ "$status" -ne 0 ]; then
            for kept in ~/.fastctx/updates/startup-error.json ~/.fastctx/world/node.log; do
              if [ -f "$kept" ]; then echo "--- $kept"; tail -n 60 "$kept"; fi
            done
          fi
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shot-linux-x64
          path: shots
          if-no-files-found: ignore
      - name: Upload the packages
        # Also when opening them failed, so the very package that failed can be opened elsewhere.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: gui-linux-x64
          path: |
            dist/gui/*.AppImage*
            dist/gui/*.deb*
          if-no-files-found: error

  android:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rust-docs
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui/src-tauri
          key: android
          save-if: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/cargo-about.py
      - name: Install the Android SDK parts the build takes
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" "ndk;29.0.14206865" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
      - name: Fetch the application's dependencies
        working-directory: gui
        run: |
          npm ci --no-audit --no-fund
          cargo fetch --locked --manifest-path src-tauri/Cargo.toml
      - name: Build the APK for every phone's processor
        working-directory: gui
        run: |
          node scripts/android.mjs build --apk
          built="$(ls src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk)"
          mkdir -p ../dist/gui
          "$ANDROID_HOME/build-tools/37.0.0/zipalign" -f -P 16 4 "$built" "../dist/gui/aligned.apk"
      - name: Sign the APK
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Fastctx's release key; a phone takes an update only from the key it was installed with.
          RELEASE_CERTIFICATE: 99590e075e2b54f5d3b02c9ec650f1bf1ece97f8605edba16c975b4feb51ca42
        working-directory: gui
        run: |
          set -o pipefail
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          keystore="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$ANDROID_KEYSTORE" | base64 -d > "$keystore"
          signed="../dist/gui/Fastctx_${version}_universal.apk"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" sign --ks "$keystore" --ks-key-alias fastctx \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEYSTORE_PASSWORD \
            --out "$signed" ../dist/gui/aligned.apk
          rm ../dist/gui/aligned.apk
          "$ANDROID_HOME/build-tools/37.0.0/zipalign" -c -P 16 4 "$signed"
          certificates="$("$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$signed")"
          printf '%s\n' "$certificates" | grep 'certificate SHA-256 digest'
          printf '%s\n' "$certificates" | grep -q "certificate SHA-256 digest: $RELEASE_CERTIFICATE"
          node node_modules/@tauri-apps/cli/tauri.js signer sign --app-version "$version" "$signed"
      - uses: actions/upload-artifact@v4
        with:
          name: gui-android
          path: dist/gui/*.apk*
          if-no-files-found: error

  update-windows:
    needs: bundle-windows
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: gui-windows-x64
          path: dist
      - name: Sign a copy of the installer as a later version
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          later="${version%.*}.99"
          mkdir -p later
          cp dist/*-setup.exe later/next-setup.exe
          npx --yes "$TAURI_CLI" signer sign --app-version "$later" later/next-setup.exe
          echo "LATER=$later" >> "$GITHUB_ENV"
      - name: Update to it, as a user with automatic updates would
        run: python scripts/update-drill.py "$(ls dist/*-setup.exe)" later/next-setup.exe "$LATER"

  # The boot service taking a newer release by itself (`world-upgrade.md`, 换版不要人确认): this run's
  # kernel keeps a hub and a node as Windows services; the same source, built as a later release and
  # signed as one, goes to the renewal, and the protected guardians take it with no administrator.
  renewal-build-windows:
    if: github.ref_type == 'branch'
    runs-on: windows-11-arm
    defaults:
      run:
        shell: bash
    env:
      RUSTFLAGS: '-C target-feature=+crt-static'
    steps:
      - uses: actions/checkout@v4
      - name: Keep the antivirus off the build's own files
        shell: pwsh
        run: Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, "$env:USERPROFILE\.cargo", "$env:USERPROFILE\.rustup"
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          # Same host, target and flags as the x64 kernel; use its existing main-branch cache.
          shared-key: kernel-x86_64-pc-windows-msvc-kernel-windows
          save-if: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the same source as a later release
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          later="$(python scripts/renewal-drill.py bump "$version")"
          node scripts/kernel.mjs x86_64-pc-windows-msvc
          mkdir -p later && cp target/x86_64-pc-windows-msvc/release/fastctx.exe later/fastctx.exe
          git checkout -- Cargo.toml Cargo.lock dist/THIRD_PARTY_LICENSES.md
          printf '%s\n' "$later" > later/version.txt
      - uses: actions/upload-artifact@v4
        with:
          name: renewal-windows
          path: later
          if-no-files-found: error

  renewal-windows:
    needs: [kernel-windows, renewal-build-windows]
    if: github.ref_type == 'branch'
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Keep the antivirus off the build's own files
        shell: pwsh
        run: Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, "$env:USERPROFILE\.cargo", "$env:USERPROFILE\.rustup"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: renewal-windows
          path: later
      - name: Read the later release's version
        run: echo "LATER=$(cat later/version.txt)" >> "$GITHUB_ENV"
      - name: Sign the later release
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # And a signature of something else for the same release, as a node of
        # an earlier release kept beside the program it unpacked.
        run: |
          npx --yes "$TAURI_CLI" signer sign --app-version "$LATER" later/fastctx.exe
          printf 'not the program' > later/decoy
          npx --yes "$TAURI_CLI" signer sign --app-version "$LATER" later/decoy
      - uses: actions/download-artifact@v4
        with:
          name: kernel-x86_64-pc-windows-msvc
          path: kernel
      - name: The guardians take the later release by themselves
        run: python scripts/renewal-drill.py run kernel/fastctx.exe later/fastctx.exe "$LATER"

  # The release a computer runs now, its node kept by its startup service, takes this run's kernel by
  # the renewal the application starts, with nothing failed and nobody asked (`world-upgrade.md`,
  # 换版不要人确认): the way every user's machine goes from one release to the next. A repair of the
  # machine it leaves then finds everything right and changes nothing (修复).
  renewal-earlier:
    needs: sign-kernels
    if: github.ref_type == 'branch'
    name: renewal from ${{ matrix.target }}'s earlier release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            program: fastctx.exe
          - target: aarch64-apple-darwin
            runner: macos-15
            program: fastctx
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            program: fastctx
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            program: fastctx
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            program: fastctx
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Windows'
        name: Keep the antivirus off the drill's files
        shell: pwsh
        run: Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, $env:RUNNER_TEMP
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # This release's program as its signed package carries it, on Windows its own signature beside it
      # as the installer carries it too: what a repair checks itself by.
      - uses: actions/download-artifact@v4
        with:
          name: signed-kernels
          path: signed
      - name: Take the earlier release's program, and this one's
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$RUNNER_OS" = Windows ]; then package="fastctx-${{ matrix.target }}.zip"; else package="fastctx-${{ matrix.target }}.tar.gz"; fi
          gh release download "v$EARLIER_RELEASE" --repo "${{ github.repository }}" -p "$package" -D earlier
          mkdir -p kernel
          if [ "$RUNNER_OS" = Windows ]; then
            unzip -q -o "earlier/$package" -d earlier
            unzip -q -o "signed/$package" -d kernel
            test -f kernel/fastctx.exe.sig
          else
            tar xzf "earlier/$package" -C earlier
            tar xzf "signed/$package" -C kernel
          fi
          chmod +x "earlier/${{ matrix.program }}" "kernel/${{ matrix.program }}"
          "earlier/${{ matrix.program }}" --version
          echo "PACKAGE=signed/$package" >> "$GITHUB_ENV"
          echo "VERSION=$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')" >> "$GITHUB_ENV"
      - name: Its startup service takes this release by itself, and a repair then changes nothing
        run: python scripts/renewal-drill.py earlier "earlier/${{ matrix.program }}" "kernel/${{ matrix.program }}" "$VERSION" "$PACKAGE"

  # Writing the manifest does not release anything. The tag job accepts only a fully green run,
  # including every independent smoke, installation, network, renewal and compatibility drill.
  manifest:
    needs: [sign-kernels, bundle-windows, bundle-macos, bundle-linux, android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: gui-*
          merge-multiple: true
          path: assets
      - uses: actions/download-artifact@v4
        with:
          name: signed-kernels
          path: assets
      - name: Write the updater's manifest
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          python3 scripts/release-manifest.py --version "$version" --assets assets --output assets/latest.json \
            --notes "This is a beta release of the new Fastctx, for testing before the stable release."
          ls -la assets
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            assets/latest.json
            assets/SHA256SUMS
            assets/fastctx-*-unknown-linux-gnu.tar.gz
            assets/fastctx-x86_64-pc-windows-msvc.zip
            assets/fastctx-*-apple-darwin.tar.gz
            assets/*-setup.exe
            assets/*.dmg
            assets/*.app.tar.gz
            assets/*.AppImage
            assets/*.deb
            assets/*.apk
          if-no-files-found: error

  # A version tag publishes what the ci/ run of its very commit built and tested, once every job of
  # that run has passed; nothing is built again.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Find the run that built and tested this commit
        id: built
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs?head_sha=$GITHUB_SHA&event=push&status=success&per_page=100" \
            --jq '[.workflow_runs[] | select(.head_branch | startswith("ci/"))] | first | .id // empty')"
          if [ -z "$run" ]; then
            echo "no ci/ run of $GITHUB_SHA passed every job: push this commit to a ci/ branch, and tag it once that run is green"
            exit 1
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
          run-id: ${{ steps.built.outputs.run }}
          github-token: ${{ github.token }}
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          test "$GITHUB_REF_NAME" = "v$version"
          test "$(python3 -c 'import json; print(json.load(open("release/latest.json"))["version"])')" = "$version"
          # A test release is a prerelease, which releases/latest and the old updaters never see; a
          # stable one is the latest.
          case "$version" in
            *-*) gh release create "$GITHUB_REF_NAME" --verify-tag --prerelease --title "Fastctx $version" \
                   --notes "This is a beta release of the new Fastctx, for testing before the stable release." release/* ;;
            *) gh release create "$GITHUB_REF_NAME" --verify-tag --latest --title "Fastctx $version" \
                 --notes "Fastctx $version." release/* ;;
          esac
