  bundle-macos:
    needs: [gui-macos, kernel-macos, kernel-linux]
    name: bundle ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: aarch64
          - target: x86_64-apple-darwin
            arch: x64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          targets: ${{ matrix.target }}
      - if: matrix.target == 'x86_64-apple-darwin'
        name: Let Apple silicon run what is built for Intel
        run: softwareupdate --install-rosetta --agree-to-license || /usr/bin/arch -x86_64 /usr/bin/true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the bundler
        working-directory: gui
        run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: prepared-${{ matrix.target }}
          path: prepared
      - name: Restore the prepared application
        run: tar -xzf prepared/gui.tar.gz
      - uses: actions/download-artifact@v4
        with:
          name: kernel-${{ matrix.target }}
          path: kernel
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*-unknown-linux-gnu
          merge-multiple: true
          path: gui/src-tauri/linux
      # The fixed certificate the application and its kernel are signed with every version, so the
      # privacy a Mac's user grants Fastctx holds across versions: in a keychain of this job alone,
      # trusted for code signing here.
      - name: Take the signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          lock="$(openssl rand -hex 16)"
          security create-keychain -p "$lock" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$lock" "$keychain"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/fastctx.p12"
          security import "$RUNNER_TEMP/fastctx.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/fastctx.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$lock" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-certificate -c Fastctx -p "$keychain" > "$RUNNER_TEMP/fastctx.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/fastctx.pem" \
            || echo "::warning::the certificate is not trusted on this runner; codesign signs with it all the same"
          security find-identity -p codesigning "$keychain" | grep -q '"Fastctx"'
      - name: Build the application
        working-directory: gui
        env:
          FASTCTX_MACOS_IDENTITY: Fastctx
        run: |
          chmod +x ../kernel/fastctx
          node scripts/release.mjs --prepared --kernel ../kernel/fastctx --target '${{ matrix.target }}' --out ../dist/gui
      - name: Check the application and its kernel carry the fixed certificate
        run: |
          app=gui/src-tauri/target/${{ matrix.target }}/release/bundle/macos/Fastctx.app
          test -d "$app" || app=gui/src-tauri/target/release/bundle/macos/Fastctx.app
          for program in "$app" "$app/Contents/MacOS/fastctx"; do
            codesign -dvv "$program" 2>&1 | grep -qx 'Authority=Fastctx'
            codesign -d -r- "$program" 2>&1 | grep -Eq 'certificate (leaf|root)'
          done
          codesign --verify --verbose "$app"
      # A Mac without the application installs from its line the kernel the application carries,
      # signed with the same fixed certificate, so what its user allows holds across versions too.
      - name: Package the signed kernel for a Mac's line
        run: |
          app=gui/src-tauri/target/${{ matrix.target }}/release/bundle/macos/Fastctx.app
          test -d "$app" || app=gui/src-tauri/target/release/bundle/macos/Fastctx.app
          codesign --verify --verbose "$app/Contents/MacOS/fastctx"
          mkdir -p dist/cli
          python3 scripts/package.py platform --target '${{ matrix.target }}' --binary "$app/Contents/MacOS/fastctx" \
            --notices dist/THIRD_PARTY_LICENSES.md --output dist/cli
      - name: Upload the signed kernel's archive
        uses: actions/upload-artifact@v4
        with:
          name: signed-archive-${{ matrix.target }}
          path: dist/cli/fastctx-*.tar.gz
          if-no-files-found: error
      - name: Sign the application for the updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        working-directory: gui
        run: |
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          node node_modules/@tauri-apps/cli/tauri.js signer sign --app-version "$version" ../dist/gui/*.app.tar.gz
      - if: matrix.target == 'aarch64-apple-darwin'
        name: Open it
        run: |
          app=gui/src-tauri/target/release/bundle/macos/Fastctx.app
          codesign --verify --verbose "$app"
          # The bundle signs what it carries again, so its bytes differ; it is the program built here
          # when it has the UUID the linker derived from that program's content.
          uuid() { dwarfdump --uuid "$1" | awk '{ print $2 }'; }
          built="$(uuid kernel/fastctx)" && test -n "$built"
          test "$(uuid "$app/Contents/MacOS/fastctx")" = "$built"
          "$app/Contents/MacOS/fastctx" --version
          "$app/Contents/MacOS/fastctx-app" > app.log 2>&1 &
          sleep 25
          pgrep -x fastctx-app
          mkdir -p shots
          screencapture -x "shots/macos-${{ matrix.arch }}.png" || true
          pkill -x fastctx-app || true
          cat app.log
      - uses: actions/upload-artifact@v4
        if: always() && matrix.target == 'aarch64-apple-darwin'
        with:
          name: shot-macos-${{ matrix.arch }}
          path: shots
          if-no-files-found: ignore
      - name: Upload the application
        uses: actions/upload-artifact@v4
        with:
          name: gui-macos-${{ matrix.arch }}
          path: |
            dist/gui/*.dmg
            dist/gui/*.app.tar.gz*
