name: Release

# Every platform's installer from one commit: the command-line programs built, tested and run on the
# machines they are for; World's installers carrying those very programs; each package signed bound
# to the release's version; and, for a version tag, a GitHub release of them with the manifest the
# updater reads. A push to a ci/ branch runs everything but the release. Nothing goes to npm.
#
# The jobs start together. One that needs what another uploads does what it can before
# (`scripts/ci-await.py`): an application compiles while the kernel it carries is still being built.
# The machines that compile fastest compile for their slower siblings: both Mac kernels and applications
# are built on Apple silicon and both Windows ones on ARM64 Windows, Intel's and x64's as cross builds,
# and an Intel Mac and an x64 Windows machine run those very kernels, tests and applications.

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: ['ci/**']

permissions:
  contents: read
  # The jobs that wait read the run's own jobs, to see what has been uploaded.
  actions: read

env:
  CARGO_TERM_COLOR: always
  TAURI_CLI: '@tauri-apps/cli@2.12.1'

jobs:
  notices:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rust-docs
      - uses: Swatinem/rust-cache@v2
        with:
          key: notices
          cache-on-failure: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/cargo-about.py
      - run: cargo fetch --locked
      - name: Write the notices
        run: |
          # The syntax definitions' notices are data two-face carries; an unoptimized build prints the same.
          cargo run --locked -p fastctx-tui --example syntax_notices > syntax-notices.md
          python scripts/notices.py --syntax-notices syntax-notices.md --output dist/THIRD_PARTY_LICENSES.md
      - name: Upload the notices
        uses: actions/upload-artifact@v4
        with:
          name: notices
          path: dist/THIRD_PARTY_LICENSES.md
          if-no-files-found: error

  kernel-windows:
    name: kernel ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, aarch64-pc-windows-msvc]
    runs-on: windows-11-arm
    defaults:
      run:
        shell: bash
    env:
      RUSTFLAGS: '-C target-feature=+crt-static'
    steps:
      - uses: actions/checkout@v4
      # These machines scan every file as it is written, and keep scanning a build's thousands of new files
      # long after it: what runs next waits behind them. The build's own files need no scan.
      - name: Keep the antivirus off the build's own files
        shell: pwsh
        run: Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, "$env:USERPROFILE\.cargo", "$env:USERPROFILE\.rustup"
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: kernel-${{ matrix.target }}
          cache-on-failure: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-launcher.cjs "$RUNNER_TEMP"
      - name: Wait for the notices
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci-await.py "notices=Upload the notices"
      - uses: actions/download-artifact@v4
        with:
          name: notices
          path: dist
      - run: node scripts/kernel.mjs '${{ matrix.target }}'
      - name: Verify version and package the native program
        run: |
          binary="target/${{ matrix.target }}/release/fastctx.exe"
          version="$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          test "$("$binary" --version)" = "fastctx $version"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then test "$GITHUB_REF_NAME" = "v$version"; fi
          python scripts/package.py platform --target '${{ matrix.target }}' --binary "$binary" --notices dist/THIRD_PARTY_LICENSES.md --output dist
          mkdir -p kernel && cp "$binary" kernel/
      - name: Upload the kernel
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.target }}
          path: kernel/fastctx.exe
          if-no-files-found: error
      - name: Upload the archive
        uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: dist/fastctx-*.zip
          if-no-files-found: error
      - name: Build the release tests
        run: node scripts/kernel.mjs --tests '${{ matrix.target }}' tests
      - if: matrix.target == 'x86_64-pc-windows-msvc'
        name: Upload the tests
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.target }}
          path: tests
          if-no-files-found: error
      - if: matrix.target == 'aarch64-pc-windows-msvc'
        name: Smoke test on this machine
        run: python scripts/smoke.py kernel/fastctx.exe
      - if: matrix.target == 'aarch64-pc-windows-msvc'
        name: Verify the bundled ripgrep, the node's lifetime, job control and byte streams
        run: |
          python scripts/ripgrep.py verify
          export FASTCTX_TEST_BASH="$(cygpath -m /usr/bin/bash.exe)"
          export FASTCTX_TEST_ROOT="$(cygpath -m "$RUNNER_TEMP")"
          tests/offline.exe
          tests/own_lifetime.exe
          tests/job_lifecycle.exe

  windows-x64:
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Wait for what ARM64 Windows built for x64
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/ci-await.py "kernel x86_64-pc-windows-msvc=Upload the kernel" \
            "kernel x86_64-pc-windows-msvc=Upload the tests" "gui x86_64-pc-windows-msvc=Upload the installer"
      - uses: actions/download-artifact@v4
        with:
          name: kernel-x86_64-pc-windows-msvc
          path: kernel
      - uses: actions/download-artifact@v4
        with:
          name: tests-x86_64-pc-windows-msvc
          path: tests
      - uses: actions/download-artifact@v4
        with:
          name: gui-windows-x64
          path: dist/gui
      - name: Smoke test on an x64 machine
        run: python scripts/smoke.py kernel/fastctx.exe
      - name: Verify the bundled ripgrep, the node's lifetime, job control and byte streams
        run: |
          python scripts/ripgrep.py verify
          export FASTCTX_TEST_BASH="$(cygpath -m /usr/bin/bash.exe)"
          export FASTCTX_TEST_ROOT="$(cygpath -m "$RUNNER_TEMP")"
          tests/offline.exe
          tests/own_lifetime.exe
          tests/job_lifecycle.exe
      - name: Install it and open it
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist/gui/*-setup.exe | Select-Object -First 1
          Start-Process $installer.FullName -ArgumentList '/S' -Wait
          $app = Join-Path $env:LOCALAPPDATA 'Fastctx/fastctx-app.exe'
          if (-not (Test-Path $app)) { throw "the installer left no $app" }
          $kernel = Join-Path $env:LOCALAPPDATA 'Fastctx/fastctx.exe'
          if ((Get-FileHash $kernel).Hash -ne (Get-FileHash kernel/fastctx.exe).Hash) { throw "the installed kernel is not the one this run built and tested" }
          & $kernel --version
          $process = Start-Process $app -PassThru
          Start-Sleep -Seconds 25
          if ($process.HasExited) { throw "Fastctx exited with $($process.ExitCode)" }
          & scripts/window-shot.ps1 -ProcessId $process.Id -Path "shots/windows-x64.png"
          Stop-Process -Id $process.Id
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shot-windows-x64
          path: shots
          if-no-files-found: ignore

  kernel-linux:
    name: kernel ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            build: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            build: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          targets: ${{ matrix.build }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: kernel-${{ matrix.target }}
          cache-on-failure: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install zig and cargo-zigbuild
        run: |
          python -m pip install ziglang==0.14.1
          cargo install --locked cargo-zigbuild --version 0.23.0
          # The kernel's debug sections and symbols are stripped with zig itself, which pip installs as a module.
          mkdir -p "$RUNNER_TEMP/zig-bin"
          printf '#!/bin/sh\nexec %s -m ziglang "$@"\n' "$(command -v python)" > "$RUNNER_TEMP/zig-bin/zig"
          chmod +x "$RUNNER_TEMP/zig-bin/zig"
          echo "$RUNNER_TEMP/zig-bin" >> "$GITHUB_PATH"
      - run: node scripts/check-launcher.cjs "$RUNNER_TEMP"
      - name: Wait for the notices
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci-await.py "notices=Upload the notices"
      - uses: actions/download-artifact@v4
        with:
          name: notices
          path: dist
      - run: node scripts/kernel.mjs '${{ matrix.target }}'
      - name: Verify version and package the native program
        run: |
          binary="target/${{ matrix.build }}/release/fastctx"
          version="$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          test "$("$binary" --version)" = "fastctx $version"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then test "$GITHUB_REF_NAME" = "v$version"; fi
          python scripts/package.py platform --target '${{ matrix.target }}' --binary "$binary" --notices dist/THIRD_PARTY_LICENSES.md --output dist
          mkdir -p kernel && cp "$binary" kernel/
      - name: Upload the kernel
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.target }}
          path: kernel/fastctx
          if-no-files-found: error
      - name: Upload the archive
        uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: dist/fastctx-*.tar.gz
          if-no-files-found: error
      - name: Smoke test on this machine
        run: python scripts/smoke.py kernel/fastctx --service
      - name: Verify the bundled ripgrep, the node's lifetime, job control and byte streams
        run: |
          node scripts/kernel.mjs --tests '${{ matrix.target }}' tests
          python scripts/ripgrep.py verify
          export FASTCTX_TEST_BASH=/bin/bash FASTCTX_TEST_ROOT="$RUNNER_TEMP"
          tests/offline
          tests/own_lifetime
          tests/job_lifecycle

  kernel-macos:
    name: kernel ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          targets: ${{ matrix.target }}
      - if: matrix.target == 'x86_64-apple-darwin'
        name: Let Apple silicon run what is built for Intel
        run: softwareupdate --install-rosetta --agree-to-license || /usr/bin/arch -x86_64 /usr/bin/true
      - uses: Swatinem/rust-cache@v2
        with:
          key: kernel-${{ matrix.target }}
          cache-on-failure: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-launcher.cjs "$RUNNER_TEMP"
      - name: Wait for the notices
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci-await.py "notices=Upload the notices"
      - uses: actions/download-artifact@v4
        with:
          name: notices
          path: dist
      - run: node scripts/kernel.mjs '${{ matrix.target }}'
      - name: Verify version and package the native program
        run: |
          binary="target/${{ matrix.target }}/release/fastctx"
          version="$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          test "$("$binary" --version)" = "fastctx $version"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then test "$GITHUB_REF_NAME" = "v$version"; fi
          python scripts/package.py platform --target '${{ matrix.target }}' --binary "$binary" --notices dist/THIRD_PARTY_LICENSES.md --output dist
          mkdir -p kernel && cp "$binary" kernel/
      - name: Upload the kernel
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.target }}
          path: kernel/fastctx
          if-no-files-found: error
      - name: Upload the archive
        uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: dist/fastctx-*.tar.gz
          if-no-files-found: error
      - if: matrix.target == 'aarch64-apple-darwin'
        name: Smoke test on this machine
        run: python scripts/smoke.py kernel/fastctx --service
      - name: Build the release tests
        run: node scripts/kernel.mjs --tests '${{ matrix.target }}' tests
      - if: matrix.target == 'aarch64-apple-darwin'
        name: Verify the bundled ripgrep, the node's lifetime, job control and byte streams, in the bash a Mac comes with
        run: |
          python scripts/ripgrep.py verify
          export FASTCTX_TEST_BASH=/bin/bash FASTCTX_TEST_ROOT="$RUNNER_TEMP"
          tests/offline
          tests/own_lifetime
          tests/job_lifecycle
      - if: matrix.target == 'x86_64-apple-darwin'
        name: Upload the tests
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.target }}
          path: tests
          if-no-files-found: error

  macos-intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Use the bash a Mac comes with
        run: |
          for bash in /opt/homebrew/bin/bash /usr/local/bin/bash; do
            if [ -e "$bash" ]; then sudo mv "$bash" "$bash.hidden"; fi
          done
          /bin/bash --version | head -1
      - name: Wait for what Apple silicon built for Intel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/ci-await.py "kernel x86_64-apple-darwin=Upload the kernel" \
            "kernel x86_64-apple-darwin=Upload the tests" "gui x86_64-apple-darwin=Upload the application"
      - uses: actions/download-artifact@v4
        with:
          name: kernel-x86_64-apple-darwin
          path: kernel
      - uses: actions/download-artifact@v4
        with:
          name: tests-x86_64-apple-darwin
          path: tests
      - uses: actions/download-artifact@v4
        with:
          name: gui-macos-x64
          path: dist
      - name: Smoke test on an Intel Mac
        run: |
          chmod +x kernel/fastctx tests/*
          python scripts/smoke.py kernel/fastctx --service --expect-bash 3.2
      - name: Verify the bundled ripgrep, the node's lifetime, job control and byte streams
        run: |
          python scripts/ripgrep.py verify
          export FASTCTX_TEST_BASH=/bin/bash FASTCTX_TEST_ROOT="$RUNNER_TEMP"
          tests/offline
          tests/own_lifetime
          tests/job_lifecycle
      - name: Open the application
        run: |
          tar -xzf dist/*.app.tar.gz -C "$RUNNER_TEMP"
          app="$RUNNER_TEMP/Fastctx.app"
          codesign --verify --verbose "$app"
          # The bundle signs what it carries again, so its bytes differ; it is the program built here
          # when it has the UUID the linker derived from that program's content.
          uuid() { dwarfdump --uuid "$1" | awk '{ print $2 }'; }
          built="$(uuid kernel/fastctx)" && test -n "$built"
          test "$(uuid "$app/Contents/MacOS/fastctx")" = "$built"
          "$app/Contents/MacOS/fastctx" --version
          "$app/Contents/MacOS/fastctx-app" > app.log 2>&1 &
          sleep 25
          pgrep -x fastctx-app
          mkdir -p shots
          screencapture -x shots/macos-x64.png || true
          pkill -x fastctx-app || true
          cat app.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shot-macos-x64
          path: shots
          if-no-files-found: ignore

  sign-kernels:
    needs: kernel-linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*-unknown-linux-gnu
          merge-multiple: true
          path: kernels
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/checkout@v4
        with:
          path: source
      - name: Sign the Linux command-line programs
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("source/Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          for archive in kernels/fastctx-*-unknown-linux-gnu.tar.gz; do
            npx --yes "$TAURI_CLI" signer sign --app-version "$version" "$archive"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: signed-kernels
          path: kernels/fastctx-*-unknown-linux-gnu.tar.gz*
          if-no-files-found: error

  gui-windows:
    name: gui ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: aarch64-pc-windows-msvc
            arch: arm64
    runs-on: windows-11-arm
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # These machines scan every file as it is written, and keep scanning a build's thousands of new files
      # long after it: what runs next waits behind them. The build's own files need no scan.
      - name: Keep the antivirus off the build's own files
        shell: pwsh
        run: Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, "$env:USERPROFILE\.cargo", "$env:USERPROFILE\.rustup"
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rust-docs
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui/src-tauri
          key: gui-${{ matrix.target }}
          cache-on-failure: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/cargo-about.py
      - name: Fetch the application's dependencies
        working-directory: gui
        run: |
          npm ci --no-audit --no-fund
          cargo fetch --locked --manifest-path src-tauri/Cargo.toml
      - name: Wait for the notices
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci-await.py "notices=Upload the notices"
      - uses: actions/download-artifact@v4
        with:
          name: notices
          path: dist
      - name: Compile the application while its kernel is built
        working-directory: gui
        run: node scripts/release.mjs --prepare --target '${{ matrix.target }}'
      - name: Wait for the kernels it carries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/ci-await.py "kernel ${{ matrix.target }}=Upload the kernel" \
            "kernel x86_64-unknown-linux-gnu=Upload the archive" "kernel aarch64-unknown-linux-gnu=Upload the archive"
      - uses: actions/download-artifact@v4
        with:
          name: kernel-${{ matrix.target }}
          path: kernel
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*-unknown-linux-gnu
          merge-multiple: true
          path: gui/src-tauri/linux
      - name: Build the installer
        working-directory: gui
        run: node scripts/release.mjs --prepared --kernel ../kernel/fastctx.exe --target '${{ matrix.target }}' --out ../dist/gui
      - name: Sign the installer for the updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        working-directory: gui
        run: |
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          for installer in ../dist/gui/*-setup.exe; do
            node node_modules/@tauri-apps/cli/tauri.js signer sign --app-version "$version" "$installer"
          done
      - if: matrix.arch == 'arm64'
        name: Install it and open it
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist/gui/*-setup.exe | Select-Object -First 1
          Start-Process $installer.FullName -ArgumentList '/S' -Wait
          $app = Join-Path $env:LOCALAPPDATA 'Fastctx/fastctx-app.exe'
          if (-not (Test-Path $app)) { throw "the installer left no $app" }
          $kernel = Join-Path $env:LOCALAPPDATA 'Fastctx/fastctx.exe'
          if ((Get-FileHash $kernel).Hash -ne (Get-FileHash kernel/fastctx.exe).Hash) { throw "the installed kernel is not the one this run built and tested" }
          & $kernel --version
          $process = Start-Process $app -PassThru
          Start-Sleep -Seconds 25
          if ($process.HasExited) { throw "Fastctx exited with $($process.ExitCode)" }
          & scripts/window-shot.ps1 -ProcessId $process.Id -Path "shots/windows-${{ matrix.arch }}.png"
          Stop-Process -Id $process.Id
      - uses: actions/upload-artifact@v4
        if: always() && matrix.arch == 'arm64'
        with:
          name: shot-windows-${{ matrix.arch }}
          path: shots
          if-no-files-found: ignore
      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: gui-windows-${{ matrix.arch }}
          path: dist/gui/*-setup.exe*
          if-no-files-found: error

  gui-macos:
    name: gui ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: aarch64
          - target: x86_64-apple-darwin
            arch: x64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rust-docs
          targets: ${{ matrix.target }}
      - if: matrix.target == 'x86_64-apple-darwin'
        name: Let Apple silicon run what is built for Intel
        run: softwareupdate --install-rosetta --agree-to-license || /usr/bin/arch -x86_64 /usr/bin/true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui/src-tauri
          key: gui-${{ matrix.target }}
          cache-on-failure: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/cargo-about.py
      - name: Fetch the application's dependencies
        working-directory: gui
        run: |
          npm ci --no-audit --no-fund
          cargo fetch --locked --manifest-path src-tauri/Cargo.toml
      - name: Wait for the notices
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci-await.py "notices=Upload the notices"
      - uses: actions/download-artifact@v4
        with:
          name: notices
          path: dist
      - name: Compile the application while its kernel is built
        working-directory: gui
        run: node scripts/release.mjs --prepare --target '${{ matrix.target }}'
      - name: Wait for the kernels it carries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/ci-await.py "kernel ${{ matrix.target }}=Upload the kernel" \
            "kernel x86_64-unknown-linux-gnu=Upload the archive" "kernel aarch64-unknown-linux-gnu=Upload the archive"
      - uses: actions/download-artifact@v4
        with:
          name: kernel-${{ matrix.target }}
          path: kernel
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*-unknown-linux-gnu
          merge-multiple: true
          path: gui/src-tauri/linux
      - name: Build the application
        working-directory: gui
        run: |
          chmod +x ../kernel/fastctx
          node scripts/release.mjs --prepared --kernel ../kernel/fastctx --target '${{ matrix.target }}' --out ../dist/gui
      - name: Sign the application for the updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        working-directory: gui
        run: |
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          node node_modules/@tauri-apps/cli/tauri.js signer sign --app-version "$version" ../dist/gui/*.app.tar.gz
      - if: matrix.target == 'aarch64-apple-darwin'
        name: Open it
        run: |
          app=gui/src-tauri/target/release/bundle/macos/Fastctx.app
          codesign --verify --verbose "$app"
          # The bundle signs what it carries again, so its bytes differ; it is the program built here
          # when it has the UUID the linker derived from that program's content.
          uuid() { dwarfdump --uuid "$1" | awk '{ print $2 }'; }
          built="$(uuid kernel/fastctx)" && test -n "$built"
          test "$(uuid "$app/Contents/MacOS/fastctx")" = "$built"
          "$app/Contents/MacOS/fastctx" --version
          "$app/Contents/MacOS/fastctx-app" > app.log 2>&1 &
          sleep 25
          pgrep -x fastctx-app
          mkdir -p shots
          screencapture -x "shots/macos-${{ matrix.arch }}.png" || true
          pkill -x fastctx-app || true
          cat app.log
      - uses: actions/upload-artifact@v4
        if: always() && matrix.target == 'aarch64-apple-darwin'
        with:
          name: shot-macos-${{ matrix.arch }}
          path: shots
          if-no-files-found: ignore
      - name: Upload the application
        uses: actions/upload-artifact@v4
        with:
          name: gui-macos-${{ matrix.arch }}
          path: |
            dist/gui/*.dmg
            dist/gui/*.app.tar.gz*
          if-no-files-found: error

  gui-linux:
    name: gui x86_64-unknown-linux-gnu
    runs-on: ubuntu-22.04
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/gui/src-tauri/target
    steps:
      - uses: actions/checkout@v4
      - name: Install the build's system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf squashfs-tools xvfb x11-utils imagemagick file libfuse2
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rust-docs
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui/src-tauri
          key: gui-linux
          cache-on-failure: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/cargo-about.py
      - name: Fetch the application's dependencies
        working-directory: gui
        run: |
          npm ci --no-audit --no-fund
          cargo fetch --locked --manifest-path src-tauri/Cargo.toml
      - name: Wait for the notices
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci-await.py "notices=Upload the notices"
      - uses: actions/download-artifact@v4
        with:
          name: notices
          path: dist
      - name: Compile the application while its kernel is built
        working-directory: gui
        run: node scripts/release.mjs --prepare
      - name: Wait for the kernels it carries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/ci-await.py "kernel x86_64-unknown-linux-gnu=Upload the kernel" \
            "kernel x86_64-unknown-linux-gnu=Upload the archive" "kernel aarch64-unknown-linux-gnu=Upload the archive"
      - uses: actions/download-artifact@v4
        with:
          name: kernel-x86_64-unknown-linux-gnu
          path: kernel
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*-unknown-linux-gnu
          merge-multiple: true
          path: gui/src-tauri/linux
      - name: Build, seal and verify the deb and the AppImage
        run: |
          chmod +x kernel/fastctx
          # linux-bundle.py checks both packages carry this very program.
          mkdir -p "$CARGO_TARGET_DIR/x86_64-unknown-linux-musl/release"
          cp kernel/fastctx "$CARGO_TARGET_DIR/x86_64-unknown-linux-musl/release/fastctx"
          cd gui
          node scripts/release.mjs --prepared --kernel ../kernel/fastctx
          python ../scripts/linux-bundle.py --target-dir "$CARGO_TARGET_DIR" --output ../dist/gui
      - name: Sign the packages for the updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        working-directory: gui
        run: |
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          for package in ../dist/gui/*.AppImage ../dist/gui/*.deb; do
            node node_modules/@tauri-apps/cli/tauri.js signer sign --app-version "$version" "$package"
          done
      - name: Open the AppImage
        run: |
          image="$(realpath dist/gui/*.AppImage)"
          chmod +x "$image"
          mkdir -p shots
          export APPIMAGE_EXTRACT_AND_RUN=1 WEBKIT_DISABLE_DMABUF_RENDERER=1
          # The application is found by its own process name, and by its window's title on the screen.
          status=0
          xvfb-run -a -s "-screen 0 1280x860x24" sh -c '
            "$1" > app.log 2>&1 &
            sleep 30
            import -window root shots/linux-x64.png
            xwininfo -root -tree | grep -F "\"Fastctx\""
            shown=$?
            pgrep -x fastctx-app > /dev/null || shown=1
            pkill -x fastctx-app
            exit $shown' sh "$image" || status=$?
          cat app.log
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shot-linux-x64
          path: shots
          if-no-files-found: ignore
      - name: Upload the packages
        uses: actions/upload-artifact@v4
        with:
          name: gui-linux-x64
          path: |
            dist/gui/*.AppImage*
            dist/gui/*.deb*
          if-no-files-found: error

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rust-docs
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui/src-tauri
          key: android
          cache-on-failure: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/cargo-about.py
      - name: Install the Android SDK parts the build takes
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" "ndk;29.0.14206865" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
      - name: Fetch the application's dependencies
        working-directory: gui
        run: |
          npm ci --no-audit --no-fund
          cargo fetch --locked --manifest-path src-tauri/Cargo.toml
      - name: Wait for the notices
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci-await.py "notices=Upload the notices"
      - uses: actions/download-artifact@v4
        with:
          name: notices
          path: dist
      - name: Build the APK for every phone's processor
        working-directory: gui
        run: |
          node scripts/android.mjs build --apk
          built="$(ls src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk)"
          mkdir -p ../dist/gui
          "$ANDROID_HOME/build-tools/37.0.0/zipalign" -f -P 16 4 "$built" "../dist/gui/aligned.apk"
      - name: Sign the APK
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Fastctx's release key; a phone takes an update only from the key it was installed with.
          RELEASE_CERTIFICATE: 99590e075e2b54f5d3b02c9ec650f1bf1ece97f8605edba16c975b4feb51ca42
        working-directory: gui
        run: |
          set -o pipefail
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          keystore="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$ANDROID_KEYSTORE" | base64 -d > "$keystore"
          signed="../dist/gui/Fastctx_${version}_universal.apk"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" sign --ks "$keystore" --ks-key-alias fastctx \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEYSTORE_PASSWORD \
            --out "$signed" ../dist/gui/aligned.apk
          rm ../dist/gui/aligned.apk
          "$ANDROID_HOME/build-tools/37.0.0/zipalign" -c -P 16 4 "$signed"
          certificates="$("$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$signed")"
          printf '%s\n' "$certificates" | grep 'certificate SHA-256 digest'
          printf '%s\n' "$certificates" | grep -q "certificate SHA-256 digest: $RELEASE_CERTIFICATE"
          node node_modules/@tauri-apps/cli/tauri.js signer sign --app-version "$version" "$signed"
      - uses: actions/upload-artifact@v4
        with:
          name: gui-android
          path: dist/gui/*.apk*
          if-no-files-found: error

  update-windows:
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for the x64 installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci-await.py "gui x86_64-pc-windows-msvc=Upload the installer"
      - uses: actions/download-artifact@v4
        with:
          name: gui-windows-x64
          path: dist
      - name: Sign a copy of the installer as a later version
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          later="${version%.*}.99"
          mkdir -p later
          cp dist/*-setup.exe later/next-setup.exe
          npx --yes "$TAURI_CLI" signer sign --app-version "$later" later/next-setup.exe
          echo "LATER=$later" >> "$GITHUB_ENV"
      - name: Update to it, as a user with automatic updates would
        run: python scripts/update-drill.py "$(ls dist/*-setup.exe)" later/next-setup.exe "$LATER"

  manifest:
    needs: [kernel-windows, windows-x64, kernel-linux, kernel-macos, macos-intel, sign-kernels, gui-windows, gui-macos, gui-linux, android, update-windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: gui-*
          merge-multiple: true
          path: assets
      - uses: actions/download-artifact@v4
        with:
          name: signed-kernels
          path: assets
      - name: Write the updater's manifest
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          python3 scripts/release-manifest.py --version "$version" --assets assets --output assets/latest.json \
            --notes "This is a beta release of the new Fastctx, for testing before the stable release."
          ls -la assets
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            assets/latest.json
            assets/*-setup.exe
            assets/*.dmg
            assets/*.app.tar.gz
            assets/*.AppImage
            assets/*.deb
            assets/*.apk
          if-no-files-found: error

  publish:
    needs: manifest
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      - name: Publish the test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          test "$GITHUB_REF_NAME" = "v$version"
          case "$version" in *-*) ;; *) echo "only a test release is published by this workflow"; exit 1 ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --prerelease --title "Fastctx $version" \
            --notes "This is a beta release of the new Fastctx, for testing before the stable release." release/*
