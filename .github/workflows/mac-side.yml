name: mac-side-alternate
on:
  push:
    branches: ['mac-walk/side-*']
permissions:
  contents: read
jobs:
  safari-dom-software:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Start source interface and Safari
        run: |
          mkdir -p evidence
          sw_vers > evidence/os.txt
          uname -m >> evidence/os.txt
          /usr/bin/safaridriver --version >> evidence/os.txt
          npm ci --prefix candidate/gui --no-audit --no-fund > evidence/npm.log 2>&1
          (cd candidate/gui && npm run dev -- --host 127.0.0.1 --port 5317) > evidence/vite.log 2>&1 &
          defaults write com.apple.Safari WebKit2GPUProcessForDOMRendering -bool false
          defaults read com.apple.Safari WebKit2GPUProcessForDOMRendering > evidence/dom-rendering-override.txt
          sudo /usr/bin/safaridriver --enable
          /usr/bin/safaridriver --port 4444 > evidence/driver.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5317/ > /dev/null && curl -fsS http://127.0.0.1:4444/status > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Paint controls and actual native clicks
        run: |
          python3 candidate/.github/mac-side/paint.py --out evidence/paint
          python3 candidate/.github/mac-side/probe.py --diagnose --out evidence/safari
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-side-dom-software
          path: evidence
          retention-days: 14
  wkwebview:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Start source interface
        run: |
          mkdir -p evidence
          sw_vers > evidence/os.txt
          uname -m >> evidence/os.txt
          /usr/bin/safaridriver --version >> evidence/os.txt
          npm ci --prefix candidate/gui --no-audit --no-fund > evidence/npm.log 2>&1
          (cd candidate/gui && npm run dev -- --host 127.0.0.1 --port 5317) > evidence/vite.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5317/ > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Real WKWebView window
        run: |
          swiftc candidate/.github/mac-side/WKProbe.swift -o evidence/wkprobe
          evidence/wkprobe evidence/wkwebview > evidence/wkprobe.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-side-wkwebview
          path: |
            evidence/*.txt
            evidence/*.log
            evidence/wkwebview
          retention-days: 14
