name: CI

on:
  push:
    # Branches only. A release tag always points at a commit already tested
    # here, and the release workflow re-runs the test matrix on its own
    # artifacts, so tag pushes would only compete for runners with the release.
    branches:
      - "**"
  pull_request:

# Superseded runs for the same ref are useless and starve the release workflow
# of concurrent runners.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The pinned Pdfium archive is a build input rather than a build output, so it belongs
# in its own cache instead of the Cargo one. Cargo gives every feature-and-profile
# combination its own build script run and the steps below visit several, so an
# uncached job pulls the same bytes once per combination from a release CDN that has
# taken this matrix red on its own. Absolute, because `cargo publish --dry-run` builds
# from a staged copy under target/ and would resolve a relative path elsewhere.
env:
  FASTCTX_PDFIUM_CACHE_DIR: ${{ github.workspace }}/.pdfium-archive-cache

jobs:
  test:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin

    steps:
      - name: Prepare Git Bash temporary directories
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $git = (Get-Command git.exe -ErrorAction Stop).Source
          $cursor = Split-Path $git -Parent
          $gitRoot = $null
          while ($cursor) {
            if (Test-Path (Join-Path $cursor "usr/bin/bash.exe")) {
              $gitRoot = $cursor
              break
            }
            $parent = Split-Path $cursor -Parent
            if (-not $parent -or $parent -eq $cursor) { break }
            $cursor = $parent
          }
          if (-not $gitRoot) { throw "Cannot locate the Git for Windows root from $git" }
          $bash = Join-Path $gitRoot "usr/bin/bash.exe"
          # Git Bash resolves POSIX /tmp through a runtime "usertemp" mount. That
          # mount ignores TEMP/TMP/TMPDIR and cannot be redirected from fstab, so
          # the target is whatever cygpath reports and nothing else. When it is
          # missing every bash start writes a warning to stderr, that warning is
          # captured as command output, and byte-exact output assertions fail.
          # Ask bash for the path instead of guessing it. (2026-07-25)
          # usr/bin/bash.exe inherits PATH from the caller, and pwsh does not
          # carry the Git toolset, so /usr/bin has to be put back by hand or
          # cygpath and mkdir below resolve to nothing.
          $posixTemp = (& $bash --noprofile --norc -c 'PATH=/usr/bin:/bin:$PATH; cygpath -w /tmp').Trim()
          if ([string]::IsNullOrWhiteSpace($posixTemp)) {
            throw "Git Bash did not report a Windows path for POSIX /tmp"
          }
          Write-Host "POSIX /tmp resolves to $posixTemp"
          $tempPaths = @(
            $posixTemp
            (Join-Path $gitRoot "tmp")
            $env:TEMP
            $env:TMP
            [System.IO.Path]::GetTempPath()
            (Join-Path $env:USERPROFILE "AppData/Local/Temp")
            (Join-Path $env:LOCALAPPDATA "Temp")
          ) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) } | Sort-Object -Unique
          foreach ($path in $tempPaths) {
            New-Item -ItemType Directory -Force -Path $path | Out-Null
          }
          # Existence alone is not the bar: bash wants a directory it can write.
          & $bash --noprofile --norc -c 'PATH=/usr/bin:/bin:$PATH; mkdir -p /tmp && printf probe > /tmp/.fastctx-probe && rm -f /tmp/.fastctx-probe'
          if ($LASTEXITCODE -ne 0) {
            throw "Git Bash could not create and write inside its POSIX /tmp directory"
          }
          # Fail here rather than eight minutes later inside the test matrix:
          # any startup chatter would be captured as command output downstream.
          $noiseLog = Join-Path ([System.IO.Path]::GetTempPath()) "gitbash-startup-noise.txt"
          & $bash --noprofile --norc -c "true" 2>$noiseLog
          $noise = Get-Content -LiteralPath $noiseLog -Raw -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $noiseLog -Force -ErrorAction SilentlyContinue
          if (-not [string]::IsNullOrWhiteSpace($noise)) {
            throw "Git Bash still writes startup noise to stderr: $noise"
          }
          # Creating the directory once is not enough: it has gone missing partway
          # through a job, after this step had already verified it. Windows refuses
          # to remove a directory that holds an open handle, so park one inside it
          # for the rest of the job and rebuild the directory if it disappears
          # regardless. Fire and forget - if the keeper fails to start, the job
          # behaves exactly as it did before. The log is the evidence trail.
          # Keep the keeper's own files off the directory it is guarding.
          $runnerTemp = if ([string]::IsNullOrWhiteSpace($env:RUNNER_TEMP)) { [System.IO.Path]::GetTempPath() } else { $env:RUNNER_TEMP }
          $keeperLog = Join-Path $runnerTemp "posix-tmp-keeper.log"
          "watching $posixTemp from $(Get-Date -Format o)" | Set-Content -LiteralPath $keeperLog -Encoding UTF8
          $keeperBody = @'
          param([string]$Target, [string]$LogPath)
          $stream = $null
          while ($true) {
            try {
              if (-not (Test-Path -LiteralPath $Target)) {
                if ($stream) { $stream.Dispose(); $stream = $null }
                New-Item -ItemType Directory -Force -Path $Target | Out-Null
                Add-Content -LiteralPath $LogPath -Value ("recreated " + (Get-Date -Format o))
              }
              if (-not $stream) {
                $anchor = Join-Path $Target ".posix-tmp-keeper"
                $stream = [System.IO.File]::Open($anchor, "OpenOrCreate", "ReadWrite", "None")
                Add-Content -LiteralPath $LogPath -Value ("anchored " + (Get-Date -Format o))
              }
            } catch {
              Add-Content -LiteralPath $LogPath -Value ("error " + (Get-Date -Format o) + " " + $_.Exception.Message)
            }
            Start-Sleep -Milliseconds 200
          }
          '@
          $keeper = Join-Path $runnerTemp "posix-tmp-keeper.ps1"
          Set-Content -LiteralPath $keeper -Value $keeperBody -Encoding UTF8
          Start-Process pwsh -WindowStyle Hidden -ArgumentList @(
            "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", $keeper,
            "-Target", $posixTemp, "-LogPath", $keeperLog
          )

      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Cache the pinned Pdfium archive
        uses: actions/cache@v4
        with:
          path: .pdfium-archive-cache
          key: pdfium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.rs') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --locked --all-targets --target ${{ matrix.target }}

      - name: Check without PDF support
        run: cargo check --locked --no-default-features --all-targets --target ${{ matrix.target }}

      - name: Test contracts
        run: cargo test --locked --all-features --target ${{ matrix.target }}

      # Contract tests leave control centers riding out their idle window and
      # detached job supervisors finishing their commands. Windows cannot
      # replace a mapped binary, so the next cargo invocation would fail with
      # os error 5 while relinking the same target. Drain between groups.
      - name: Drain test processes
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/drain-test-processes.ps1

      - name: Test contracts without PDF support
        run: cargo test --locked --no-default-features --target ${{ matrix.target }}

      - name: Drain test processes before the release profile
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/drain-test-processes.ps1

      - name: Test release profile
        run: cargo test --locked --release --target ${{ matrix.target }}

      # Runs even when the matrix above fails: a "recreated" entry here is the
      # evidence that something removed the directory mid-job, which is what
      # made byte-exact shell assertions fail before the keeper existed.
      - name: Report the POSIX /tmp keeper log
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "posix-tmp-keeper.log"
          if (Test-Path -LiteralPath $log) {
            Get-Content -LiteralPath $log
          } else {
            Write-Host "no keeper log at $log"
          }
          $bash = "C:/Program Files/Git/usr/bin/bash.exe"
          if (Test-Path -LiteralPath $bash) {
            Write-Host "POSIX /tmp now resolves to $(& $bash --noprofile --norc -c 'PATH=/usr/bin:/bin:$PATH; cygpath -w /tmp')"
            & $bash --noprofile --norc -c 'test -d /tmp && echo "/tmp exists" || echo "/tmp MISSING"'
          }

      - name: Lint
        run: cargo clippy --locked --all-targets --all-features --target ${{ matrix.target }} -- -D warnings

      - name: Lint without PDF support
        run: cargo clippy --locked --no-default-features --all-targets --target ${{ matrix.target }} -- -D warnings

      # The lints above run in debug, so anything gated on `debug_assertions`
      # compiles out of the release profile unseen: a parameter used only by a
      # test hook reads as unused, and its `mut` as unnecessary. That blind spot
      # has now produced warnings twice, in two different modules. One platform
      # closes it, because `debug_assertions` has nothing to do with the target.
      - name: Lint the release profile
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo clippy --locked --release --all-targets --all-features --target ${{ matrix.target }} -- -D warnings

      - name: Set up Node.js for npm packaging
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Drain test processes before packaging
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/drain-test-processes.ps1

      - name: Build npm binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Pack and verify npm installation
        shell: pwsh
        run: |
          $binary = if ($IsWindows) { "fastctx.exe" } else { "fastctx" }
          ./scripts/stage-npm-package.ps1 `
            -Target "${{ matrix.target }}" `
            -Binary "target/${{ matrix.target }}/release/$binary" `
            -IncludeRootPackages
          $version = (Select-String -LiteralPath Cargo.toml -Pattern '^version = "([^"]+)"$').Matches[0].Groups[1].Value
          $platform = switch ("${{ matrix.target }}") {
            "x86_64-pc-windows-msvc" { "fastctx-win32-x64-$version.tgz" }
            "aarch64-pc-windows-msvc" { "fastctx-win32-arm64-$version.tgz" }
            "x86_64-unknown-linux-gnu" { "fastctx-linux-x64-$version.tgz" }
            "x86_64-apple-darwin" { "fastctx-darwin-x64-$version.tgz" }
            "aarch64-apple-darwin" { "fastctx-darwin-arm64-$version.tgz" }
          }
          ./scripts/verify-npm-install.ps1 `
            -PlatformTarball "dist/npm/$platform" `
            -MainTarball "dist/npm/fastctx-$version.tgz" `
            -AliasTarball "dist/npm/codex-fastctx-$version.tgz"

      # Machines that cannot build fastctx themselves (a small VPS acting as a World hub or
      # member) take the release binary from here instead of from a tagged release. Short
      # retention: these are branch builds, not distribution artifacts.
      - name: Upload the release binary
        uses: actions/upload-artifact@v4
        with:
          name: fastctx-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/fastctx
            target/${{ matrix.target }}/release/fastctx.exe
          if-no-files-found: error
          retention-days: 7

  package:
    name: Package dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify distribution contract
        shell: pwsh
        run: ./scripts/verify-distribution-contract.ps1
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify frozen v0.1.1 compatibility evidence
        run: python3 tools/verify-v011-assets.py
      - uses: Swatinem/rust-cache@v2
      - name: Cache the pinned Pdfium archive
        uses: actions/cache@v4
        with:
          path: .pdfium-archive-cache
          key: pdfium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.rs') }}
      - run: cargo publish --locked --dry-run
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - shell: pwsh
        run: ./scripts/pack-npm-root.ps1

  supply-chain:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.19.7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.0
      - run: cargo deny check
      - run: cargo about generate --locked --fail about.hbs --output-file THIRD_PARTY_LICENSES_RUST.md
      - name: Third-party license inventory is current
        run: |
          if ! git diff --quiet -- THIRD_PARTY_LICENSES_RUST.md; then
            echo "::error::THIRD_PARTY_LICENSES_RUST.md no longer matches Cargo.lock. Regenerate it with 'cargo about generate --locked --fail about.hbs --output-file THIRD_PARTY_LICENSES_RUST.md' and commit the result."
            git diff -- THIRD_PARTY_LICENSES_RUST.md
            exit 1
          fi

  msrv:
    name: Rust 1.88 minimum version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-1.88.0
      - name: Cache the pinned Pdfium archive
        uses: actions/cache@v4
        with:
          path: .pdfium-archive-cache
          key: pdfium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.rs') }}
      - run: cargo check --locked --all-targets
