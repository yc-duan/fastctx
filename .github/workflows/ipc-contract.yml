name: IPC compatibility

on:
  pull_request:
  push:
    branches: [main, rebuild]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: cargo test --locked -j 2 -p fastctx-types --test ipc_contract
      - run: python scripts/check-ipc-contract.py
