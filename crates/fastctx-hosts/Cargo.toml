[package]
name = "fastctx-hosts"
description = "Everything the World knows of each agent host: Codex's app-server and Claude Code's plugin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
fastctx-platform = { path = "../fastctx-platform" }
fastctx-types = { path = "../fastctx-types" }
filetime = "0.2"
jiff.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
toml = "0.9"
unicode-normalization = "0.1"
