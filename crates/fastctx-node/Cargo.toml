[package]
name = "fastctx-node"
description = "The node: the one long-lived process on each machine, and the only writer of the World's state there"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
fastctx-hands = { path = "../fastctx-hands" }
fastctx-hosts = { path = "../fastctx-hosts" }
fastctx-net = { path = "../fastctx-net" }
fastctx-platform = { path = "../fastctx-platform" }
fastctx-types = { path = "../fastctx-types" }
getrandom = { version = "0.3", features = ["std"] }
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
