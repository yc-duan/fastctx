[package]
name = "fastctx-net"
description = "Machines and the hub: keys and signatures, membership, the wire, and each machine's link to the hub"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
base64 = "0.22"
ed25519-dalek = "3.0.0"
fastctx-platform = { path = "../fastctx-platform" }
fastctx-types = { path = "../fastctx-types" }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = { version = "0.3", features = ["std"] }
jiff.workspace = true
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "crypto"] }
# The ring provider throughout: aws-lc-rs needs cmake and NASM to build.
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
socket2 = { version = "0.6.5", features = ["all"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
tokio-rustls = { version = "0.26.5", default-features = false, features = ["ring"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
zeroize = { version = "1.8", features = ["serde"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_System_Power",
    "Win32_UI_WindowsAndMessaging",
] }
