[package]
name = "fastctx-hub"
description = "The hub: the one machine every machine of a World connects to"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
fastctx-net = { path = "../fastctx-net" }
fastctx-platform = { path = "../fastctx-platform" }
fastctx-types = { path = "../fastctx-types" }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26.5", default-features = false, features = ["ring"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
