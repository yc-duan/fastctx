[package]
name = "fastctx-client"
description = "The one way into the node: every command, the TUI and later the graphical interface go through it"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
base64 = "0.22"
getrandom = { version = "0.3", features = ["std"] }
fastctx-net = { path = "../fastctx-net" }
fastctx-platform = { path = "../fastctx-platform" }
fastctx-types = { path = "../fastctx-types" }
fastctx-update = { path = "../fastctx-update" }
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }
