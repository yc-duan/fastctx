[dependencies]
fastctx-platform = { path = "../fastctx-platform" }
fastctx-storage = { path = "../fastctx-storage" }
fastctx-types = { path = "../fastctx-types" }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tokio = { workspace = true, features = ["rt", "sync", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }

[lints]
workspace = true
