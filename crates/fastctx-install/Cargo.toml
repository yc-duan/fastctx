[package]
name = "fastctx-install"
description = "Putting the World's tools into the user's own Codex and Claude Code sessions, taking them out, and taking over what an old fastctx left"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
fastctx-hands = { path = "../fastctx-hands" }
fastctx-hosts = { path = "../fastctx-hosts" }
fastctx-platform = { path = "../fastctx-platform" }
getrandom = { version = "0.3", features = ["std"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"
xattr = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
tempfile = "3"
