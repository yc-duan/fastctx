[package]
name = "fastctx-install"
description = "Putting the World's tools into the user's own Codex and Claude Code sessions, taking them out, and taking over what an old fastctx left"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
fastctx-hands = { path = "../fastctx-hands" }
fastctx-hosts = { path = "../fastctx-hosts" }
fastctx-platform = { path = "../fastctx-platform" }
fastctx-types = { path = "../fastctx-types" }
getrandom = { version = "0.3", features = ["std"] }
jsonc-parser = "0.33.1"
jiff.workspace = true
regex-lite = "0.1"
ryu-js = "1"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
toml = "0.9"
toml_edit = "0.25"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
xattr = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_System_RemoteDesktop",
    "Win32_System_IO",
    "Win32_System_Ioctl",
] }

[dev-dependencies]
tempfile = "3"
