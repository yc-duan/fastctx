[package]
name = "fastctx-bench"
description = "The numbers of the sync design's §18, measured on fixed inputs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
fastctx-content = { path = "../fastctx-content", features = ["drill"] }
fastctx-hosts = { path = "../fastctx-hosts", features = ["drill"] }
fastctx-net = { path = "../fastctx-net" }
fastctx-platform = { path = "../fastctx-platform" }
fastctx-types = { path = "../fastctx-types" }
jiff.workspace = true
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "time"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }

[target.'cfg(windows)'.dependencies]
uds_windows = "1.1.0"

[lints]
workspace = true
