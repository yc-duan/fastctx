[package]
name = "fastctx-hands"
description = "The World's hands: run, view and write"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[test]]
name = "job_lifecycle"
harness = false

[dependencies]
base64 = "0.22"
encoding_rs = "0.8"
fastctx-client = { path = "../fastctx-client" }
fastctx-platform = { path = "../fastctx-platform" }
fastctx-types = { path = "../fastctx-types" }
getrandom = { version = "0.3", features = ["std"] }
hayro = "0.8"
jiff.workspace = true
memmap2 = "0.9"
miniz_oxide = "0.8"
png = "0.18"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
stacker = "0.1"
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
